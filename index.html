<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EuroPython 2026 — Offline Guide</title>
<meta name="description" content="Offline conference guide for EuroPython 2026 — schedule, speakers, favorites, timeline and recommendations.">
<meta name="theme-color" content="#0e1015">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EuroPython 2026">
<style>
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#161922; --surface-2:#1e222d; --surface-3:#262b38;
  --text:#e8eaee; --text-dim:#9aa1b0; --text-faint:#6b7180;
  --border:#2a2f3d; --border-soft:#20242f;
  --accent:#5eead4; --accent-strong:#2dd4bf; --accent-ink:#04201b;
  --accent2:#818cf8; --danger:#f87171; --star:#fbbf24;
  --shadow:0 10px 30px -10px rgba(0,0,0,.55);
  --scrollbar:#333847;
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f6f7fa; --surface-3:#ebedf2;
  --text:#171a20; --text-dim:#565d6b; --text-faint:#868d99;
  --border:#e1e4ea; --border-soft:#ececf1;
  --accent:#0d9488; --accent-strong:#0f766e; --accent-ink:#ffffff;
  --accent2:#4f46e5; --danger:#dc2626; --star:#d97706;
  --shadow:0 10px 30px -12px rgba(20,20,30,.15);
  --scrollbar:#d6d9e0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:6px;}
a{color:var(--accent2);}
button{font-family:inherit;}
#app{display:flex;flex-direction:column;min-height:100vh;}

.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:16px;
  padding:12px 20px;background:rgba(14,16,21,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
:root[data-theme="light"] .topbar{background:rgba(255,255,255,.85);}
.brand{font-weight:700;font-size:1.15rem;white-space:nowrap;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;}
.brand span{color:var(--accent);}
.tabs{display:flex;gap:4px;flex-wrap:wrap;}
.tab{
  background:transparent;border:1px solid transparent;color:var(--text-dim);
  padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.92rem;font-weight:600;
  display:flex;align-items:center;gap:6px;transition:.15s;
}
.tab:hover{color:var(--text);background:var(--surface-2);}
.tab.active{color:var(--accent-ink);background:var(--accent);}
.count-badge{
  background:rgba(0,0,0,.18);border-radius:999px;padding:1px 7px;font-size:.75rem;font-weight:700;
}
.tab.active .count-badge{background:rgba(0,0,0,.22);}
.tab:not(.active) .count-badge{background:var(--surface-3);}
.topbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
#searchInput{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:9px 14px;border-radius:10px;min-width:220px;font-size:.9rem;outline:none;
}
#searchInput:focus{border-color:var(--accent);}
.icon-btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:1.05rem;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.icon-btn:hover{background:var(--surface-3);}

.filterbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:12px 20px;border-bottom:1px solid var(--border-soft);
  background:var(--bg);position:sticky;top:61px;z-index:20;
}
.filterbar select, .filterbar .chip-toggle{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:7px 10px;border-radius:8px;font-size:.84rem;cursor:pointer;outline:none;
}
.filterbar select:focus{border-color:var(--accent);}
.chip-toggle{display:flex;align-items:center;gap:6px;user-select:none;}
.chip-toggle input{accent-color:var(--accent);}
.filter-spacer{flex:1;}
.result-count{color:var(--text-faint);font-size:.82rem;white-space:nowrap;}
.clear-filters{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  padding:7px 10px;border-radius:8px;font-size:.82rem;cursor:pointer;
}
.clear-filters:hover{color:var(--text);border-color:var(--text-dim);}

main{flex:1;padding:20px;max-width:1280px;width:100%;margin:0 auto;}

.day-heading{
  display:flex;align-items:baseline;gap:10px;margin:26px 0 14px;
  padding-bottom:8px;border-bottom:1px solid var(--border-soft);
}
.day-heading:first-child{margin-top:4px;}
.day-heading h2{font-size:1.1rem;margin:0;}
.day-heading .date{color:var(--text-faint);font-size:.85rem;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;}

/* Timeline / calendar grid */
.timeline-note{margin:-8px 0 14px;}
.cal-scroll{
  max-height:74vh;overflow:auto;border:1px solid var(--border);border-radius:12px;
  position:relative;background:var(--surface);margin-bottom:28px;
}
.cal-col-headers{
  display:flex;position:sticky;top:0;left:0;z-index:6;background:var(--surface);
  border-bottom:1px solid var(--border);
}
.cal-gutter-spacer{width:56px;flex-shrink:0;border-right:1px solid var(--border-soft);}
.cal-col-header{
  flex-shrink:0;width:170px;box-sizing:border-box;padding:9px 8px;font-size:.72rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);text-align:center;
  border-right:1px solid var(--border-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cal-grid{position:relative;}
.cal-hour-row{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--border-soft);pointer-events:none;}
.cal-gutter{position:absolute;left:0;top:0;width:56px;bottom:0;pointer-events:none;}
.cal-hour-label{
  position:absolute;left:6px;font-size:.68rem;color:var(--text-faint);transform:translateY(-8px);
  background:var(--surface);padding:0 2px;
}
.cal-event{
  position:absolute;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--border);
  border-left:3px solid var(--accent2);border-radius:8px;padding:5px 8px 6px;overflow:hidden;
  cursor:pointer;transition:.12s;z-index:2;
}
.cal-event:hover{border-color:var(--accent);box-shadow:var(--shadow);z-index:3;}
.cal-event.fmt-keynote{border-left-color:#f59e0b;}
.cal-event.fmt-panel{border-left-color:#a78bfa;}
.cal-event.fmt-workshop{border-left-color:#2dd4bf;}
.cal-event.fmt-poster{border-left-color:#9ca3af;}
.cal-event.fmt-lightning{border-left-color:#fbbf24;}
.cal-event.fmt-ceremony{border-left-color:#f472b6;}
.cal-event.fmt-social{border-left-color:#22d3ee;}
.cal-event.fmt-discussion{border-left-color:#60a5fa;}
.cal-event.fmt-talk{border-left-color:var(--accent2);}
.cal-event-time{font-size:.66rem;color:var(--text-faint);font-weight:700;padding-right:16px;}
.cal-event-title{
  font-size:.79rem;font-weight:700;line-height:1.25;margin-top:1px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.cal-event-speakers{
  font-size:.68rem;color:var(--accent2);margin-top:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.cal-star-btn{
  position:absolute;top:2px;right:3px;background:none;border:none;cursor:pointer;
  color:var(--text-faint);font-size:.9rem;padding:3px;line-height:1;z-index:4;
}
.cal-star-btn.active{color:var(--star);}
.cal-now-line{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--danger);z-index:5;pointer-events:none;}
.cal-now-dot{position:absolute;left:-4px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--danger);}
.cal-now-label{
  position:absolute;left:9px;top:-9px;font-size:.64rem;font-weight:700;color:#fff;
  background:var(--danger);padding:1px 5px;border-radius:4px;white-space:nowrap;
}
@media (max-width:640px){
  .cal-col-header{font-size:.66rem;}
}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow);}
.card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.badge{
  font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-dim);
  white-space:nowrap;
}
.badge.day{background:var(--surface-3);color:var(--text-dim);}
.badge.level-beginner{background:#16412a;color:#6ee7b7;}
.badge.level-intermediate{background:#1e3a5f;color:#7dd3fc;}
.badge.level-advanced{background:#4a1d2e;color:#fda4af;}
:root[data-theme="light"] .badge.level-beginner{background:#dcfce7;color:#15803d;}
:root[data-theme="light"] .badge.level-intermediate{background:#dbeafe;color:#1d4ed8;}
:root[data-theme="light"] .badge.level-advanced{background:#fee2e2;color:#b91c1c;}
.badge.fmt-keynote{background:#4a3a12;color:#fcd34d;}
.badge.fmt-panel{background:#3a2a56;color:#c4b5fd;}
.badge.fmt-workshop{background:#0d3b3a;color:#5eead4;}
.badge.fmt-poster{background:#33313a;color:#c9c9d6;}
.badge.fmt-lightning{background:#4a3a12;color:#fde68a;}
.badge.fmt-ceremony{background:#4a1d38;color:#f9a8d4;}
.badge.fmt-social{background:#123a45;color:#67e8f9;}
.badge.fmt-discussion{background:#1a2f52;color:#93c5fd;}
:root[data-theme="light"] .badge.fmt-keynote{background:#fef3c7;color:#92400e;}
:root[data-theme="light"] .badge.fmt-panel{background:#ede9fe;color:#5b21b6;}
:root[data-theme="light"] .badge.fmt-workshop{background:#ccfbf1;color:#0f766e;}
:root[data-theme="light"] .badge.fmt-poster{background:#eeeef1;color:#3f3f46;}
:root[data-theme="light"] .badge.fmt-lightning{background:#fef9c3;color:#854d0e;}
:root[data-theme="light"] .badge.fmt-ceremony{background:#fce7f3;color:#9d174d;}
:root[data-theme="light"] .badge.fmt-social{background:#cffafe;color:#0e7490;}
:root[data-theme="light"] .badge.fmt-discussion{background:#dbeafe;color:#1e40af;}

.star-btn{
  margin-left:auto;background:none;border:none;cursor:pointer;font-size:1.15rem;
  color:var(--text-faint);line-height:1;padding:2px;
}
.star-btn.active{color:var(--star);}
.card-title{margin:0;font-size:1rem;font-weight:700;line-height:1.35;}
.card-speakers{color:var(--accent2);font-size:.82rem;font-weight:600;}
.card-summary{color:var(--text-dim);font-size:.87rem;line-height:1.5;margin:0;flex:1;}
.card-meta{color:var(--text-faint);font-size:.78rem;display:flex;gap:8px;flex-wrap:wrap;}
.more-link{
  align-self:flex-start;color:var(--accent);font-size:.82rem;font-weight:700;
  background:none;border:none;cursor:pointer;padding:0;margin-top:2px;
}
.more-link:hover{text-decoration:underline;}

.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-faint);
}
.empty-state .big{font-size:2.4rem;margin-bottom:10px;}

.section-title{font-size:1.05rem;margin:0 0 4px;}
.section-sub{color:var(--text-faint);font-size:.85rem;margin:0 0 16px;}
.starred-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.starred-actions{display:flex;gap:8px;flex-shrink:0;}

/* Speakers */
.speaker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.speaker-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s;
}
.speaker-card:hover{border-color:var(--accent2);transform:translateY(-1px);}
.speaker-avatar{
  width:40px;height:40px;border-radius:50%;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent2);
  flex-shrink:0;font-size:.95rem;
}
.speaker-name{font-weight:700;font-size:.92rem;}
.speaker-count{color:var(--text-faint);font-size:.78rem;}
.back-link{
  background:none;border:none;color:var(--accent2);cursor:pointer;font-size:.88rem;
  font-weight:700;padding:0 0 14px;display:inline-flex;align-items:center;gap:4px;
}
.speaker-header{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.speaker-header .speaker-avatar{width:64px;height:64px;font-size:1.4rem;}
.speaker-header h2{margin:0;font-size:1.3rem;}
.speaker-bio{color:var(--text-dim);font-size:.9rem;line-height:1.6;max-width:70ch;margin:14px 0 24px;}

/* Recommended */
.reco-reason{color:var(--accent);font-size:.75rem;font-weight:700;margin-top:-2px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,5,8,.6);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;
  z-index:100;overflow-y:auto;
}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  max-width:680px;width:100%;padding:26px 26px 30px;box-shadow:var(--shadow);
  animation:pop .15s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-close{
  float:right;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
  width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:1rem;
}
.modal-close:hover{color:var(--text);}
.modal h2{margin:6px 0 10px;font-size:1.3rem;line-height:1.3;padding-right:40px;}
.modal-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.modal-speakers{margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;}
.speaker-chip{
  background:var(--surface-2);border:1px solid var(--border);color:var(--accent2);
  padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:700;cursor:pointer;
}
.speaker-chip:hover{border-color:var(--accent2);}
.modal-body p{margin:0 0 12px;line-height:1.65;font-size:.92rem;color:var(--text);}
.modal-body ul{margin:0 0 12px;padding-left:20px;line-height:1.6;font-size:.92rem;}
.modal-body code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:.85em;}
.modal-body .bio-block{
  margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);
}
.modal-body .bio-block h4{margin:0 0 8px;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);}
.modal-footer{display:flex;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);}
.modal-star-btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.86rem;
  display:flex;align-items:center;gap:6px;
}
.modal-star-btn.active{color:var(--star);border-color:var(--star);}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--surface-3);color:var(--text);border:1px solid var(--border);
  padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:.88rem;
  z-index:200;max-width:90vw;text-align:center;animation:toastIn .18s ease-out;
}
.toast.error{border-color:var(--danger);color:var(--danger);}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}

@media (max-width:640px){
  .topbar{padding:10px 12px;}
  #searchInput{min-width:0;flex:1;}
  main{padding:14px;}
  .filterbar{padding:10px 12px;position:static;}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">🐍 EuroPython <span>2026</span></div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="overview">Overview</button>
      <button class="tab" data-view="timeline">Timeline</button>
      <button class="tab" data-view="speakers">Speakers</button>
      <button class="tab" data-view="starred">Starred <span class="count-badge" id="starCount">0</span></button>
      <button class="tab" data-view="recommended">Recommended</button>
    </nav>
    <div class="topbar-actions">
      <input id="searchInput" type="search" placeholder="Search talks, speakers, topics…" autocomplete="off">
      <button class="icon-btn" id="exportBtn" title="Copy starred talks to clipboard">⬇</button>
      <button class="icon-btn" id="importBtn" title="Import starred talks from clipboard">⬆</button>
      <button class="icon-btn" id="themeToggle" title="Toggle dark/light mode">🌙</button>
    </div>
  </header>

  <div class="filterbar" id="filterbar"></div>

  <main id="mainContent"></main>
</div>

<div id="modalRoot"></div>

<script id="talk-data" type="application/json">{"talks": [{"id": "d1-01", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 0, "time": "09:00–09:30", "title": "Conference Opening 🎉", "speakers": [], "level": "Beginner", "duration": "30 minutes", "room": "S1", "format": "ceremony", "summary": "EuroPython 2026 kicks off with a welcome and a look at what the week has in store.", "description": "Welcome to EuroPython 2026!\n\nJoin us on the opening session, where we will kick-off the conference days, and tell you what's going to happen in the following days. You will have three days filled with Keynotes, talks, panels, and open spaces, lightning talks, and a weekend full of sprints and other events for people attending the conference.", "bio": "", "tags": []}, {"id": "d1-02", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 1, "time": "09:30–10:15", "title": "How Complex Systems Taught Me To Fail", "speakers": ["Imogen Wright"], "level": "Beginner", "duration": "45 minutes", "room": "S1", "format": "talk", "summary": "A meandering, sarcasm-laced tour through twenty years of complex systems in physics, cloud computing and pandemic response, distilled into laws about resilience and failure.", "description": "This talk traces a meandering story of twenty years of invention, triumph and disaster, touching on theoretical physics, cloud computing, viral genetics, pandemic responses, and nearly dying in an NHS A&E queue. You'll pick up four generally applicable laws of complex systems, gain some superpowers for averting an apocalypse, and hopefully laugh a bit along the way. This isn't much of a technical talk and it is neither sanitised nor triumphant — expect sarcasm, most of all during the rough patches. My hope is that you'll leave seeing your own work differently, especially if it's quiet and unglamorous. Resilience is a property of systems, not their components, and it's the people who notice small changes and tend locally who make the biggest differences of all.", "bio": "Imogen Wright (they/them) is a South African software engineer and bioinformatician who has spent the last two decades trying to make complex systems behave — in theoretical physics, HIV drug resistance and COVID genomics, healthcare communications, cloud technologies and even ad tech. They studied computer science and physics at Rhodes University, completed a masters in theoretical physics at the Perimeter Institute (where Stephen Hawking was guest of honour at their graduation), and earned a PhD in bioinformatics from the University of the Western Cape. Imogen co-founded Hyrax Biosciences, whose Exatype software helps track HIV drug resistance across Africa and assembled the first Omicron variant SARS-CoV-2 genomes.", "tags": []}, {"id": "d1-03", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 2, "time": "10:45–11:30", "title": "Free-threaded Python: past, present and future", "speakers": ["Thomas Wouters"], "level": "Intermediate", "duration": "45 minutes", "room": "S1", "format": "talk", "summary": "A core developer explains what removing the GIL actually means for your code, why it isn't another Python 2-to-3 migration, and how the transition will unfold.", "description": "Free-threaded Python, the effort to remove the Global Interpreter Lock from CPython, is one of the biggest and most exciting changes to Python in many years. However, It can be hard to follow what that means, what effect it will have on you and your code, and how this isn't yet another Python 2 to 3 migration.\n\nThis overview will explain what free-threading is, why it's a big deal, how it differs from other ways to deal with the GIL, and what the plan is for ensuring a smooth migration. We'll explain the basics of thread safety, data races, and concurrent designs, how those apply to Python code, and how this will and won't change when the GIL is disabled. And yes, we'll show some threads go *brrr*.\n\nAlthough we'll mention some complex, deeply technical problems, this is not a technical deep dive and any experience level is welcome.", "bio": "Thomas is a long-time Python core developer, Steering Council member, and Software Engineer at Meta who currently works on Python internals and Free-threaded Python tooling. Also, cats.", "tags": []}, {"id": "d1-04", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 3, "time": "10:45–11:30", "title": "How CPythons Errors keep getting better", "speakers": ["Florian Freitag"], "level": "Intermediate", "duration": "45 minutes", "room": "S2", "format": "talk", "summary": "A history of Python's error messages from 3.0 to today, and why making them good is more art than science.", "description": "The upcoming Python 3.15 keeps improving error messages, which will be the fourth out of the last five releases to establish this most recent tradition. Good errors help developers debug faster and keep beginners from giving up in frustration.\n\nIn this talk we go all the way back to 2008 and explore how error messages evolved from Python 3.0 to today. Along the way we will also go into what makes up a good error message and why they are often so hard to get right. We'll also touch on how academia and research let us down and why good errors remain an art more than an exact science. I will also talk about my personal experience and the ~~bad~~ *unfortunate* error message I encountered during my first teaching job that fueled my passion for compiler and language development.\n\nFinally, I will also argue why you not only don't have to be a compiler engineer to contribute to python errors but why not being one might be an actual advantage.\n\nBy the end, you will have learned what makes a good error message, how to spot a bad one and how to fix them.", "bio": "", "tags": []}, {"id": "d1-05", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 4, "time": "10:45–11:30", "title": "How to Talk With Your Legal Department About Open Source", "speakers": ["Vladimir Slavov"], "level": "Beginner", "duration": "45 minutes", "room": "S3A", "format": "talk", "summary": "A practical primer on open-source licensing so engineers can hold their own in conversations with legal teams.", "description": "Open source software (OSS) is today an integral part of software solutions and the software industry as a whole. However, it is often the case that not all parts of an organization are equally familiar with the OSS ecosystem and the specific licenses upon which it relies. Since this ecosystem is built on intellectual property, discussions about using OSS, patching existing OSS projects, or publishing one's own software as an OSS project inevitably involve conversations with the legal department at some point. In this talk, we will discuss some of the fundamentals of intellectual property, OSS licenses, how lawyers tend to think about software in general, and how to convince them that OSS is a good idea.", "bio": "", "tags": []}, {"id": "d1-06", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 5, "time": "10:45–11:30", "title": "Should you trust Trusted Publishing?", "speakers": ["Nikita Karamov"], "level": "Intermediate", "duration": "45 minutes", "room": "S3B", "format": "talk", "summary": "A critical look at PyPI's Trusted Publishing, its centralization risks, and how it can still be misconfigured or abused.", "description": "In 2023, PyPI started supporting Trusted Publishers: A way to publish Python packages to PyPI without relying on insecure password and short-lived tokens. Three years later, this approach has become the default answer to package registries' security, as it found its way into NPM, crates.io, and RubyGems. But does it actually offer the benefits we hoped it would? Can you really trust the green checkmark, and if you can't, what's the point?\n\nIn this talk, I want to look closely at what Trusted Publishers are, and what we *might* think they are; who they do and do not protect. We'll explore the potential centralization problem of relying on Big Tech, US-based CI providers, leaving little room for smaller players like Codeberg and Sourcehut, as well as self-hosted Git forges and CI engines.\n\nBut even when using GitHub, Trusted Publisher may be tricky to get right, exposing different backdoors for the attacker to exploit. I want to discuss the illusion of security Trusted Publishers may give the inexperienced PyPI user; that is, if they actually decide to look at the hidden details of the published artifacts. How can we safeguard our Python projects, and should it be us who safeguards it? I will propose some solutions to this issue, including how the package managers and the PyPI registry itself can help us in this task.\n\nLastly, we'll reminisce about the past in search of answer. Maybe OpenPGP 'Web of Trust' wasn't such a bad idea after all? Can we regain our independence in deciding who we do and don't trust?", "bio": "", "tags": []}, {"id": "d1-07", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 6, "time": "10:45–11:30", "title": "Scaling Python Systems by Designing Team-Aware Architecture", "speakers": ["Ivan Markeev"], "level": "Intermediate", "duration": "45 minutes", "room": "S4", "format": "talk", "summary": "A framework for designing Python service architecture so it scales with the team, not just the traffic.", "description": "Python systems rarely fail because of raw performance limits.\n\nThey fail because the architecture does not scale with the team.\n\nAs services grow, coordination overhead increases. Shared databases create implicit coupling. API contracts become political boundaries. Async workflows leak across domains. Meetings multiply to compensate for structural flaws.\n\nInstead of adding process, we should redesign architecture.\n\nThis talk explores how Python system design directly determines team scalability.\n\nUsing real-world backend systems built with FastAPI, asyncio, gRPC (grpcio), PostgreSQL, Redis, Docker, we will examine how architectural decisions shape organizational complexity.\n\nTopics include:\n- Domain boundaries in Python services and their impact on ownership\n- Database-per-service vs shared schemas\n- REST vs gRPC as team contracts\n- Monorepo vs polyrepo trade-offs in multi-service Python ecosystems\n- Contract testing and schema evolution\n- Observability as an interface between teams\n- Async workloads and cross-service backpressure\n- When microservices increase coordination cost instead of reducing it\n\nRather than promoting a single architecture style, this session introduces a framework for evaluating whether a design reduces or amplifies team cognitive load.\n\nAttendees will leave with criteria for defining service boundaries that align with ownership, patterns for reducing cross-team friction through architectural design, warning signs that architecture is becoming a coordination bottleneck, and practical techniques for evolving Python systems without multiplying process.\n\nThis talk is intended for experienced Python engineers, architects, and technical leaders responsible for systems that must scale both technically and organizationally.", "bio": "", "tags": []}, {"id": "d1-08", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 7, "time": "11:40–12:10", "title": "Inside Python 3.15's JIT Optimizer", "speakers": ["Ken Jin"], "level": "Advanced", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "A deep look at how Python 3.15's revamped JIT optimizer decides what to compile and how, built by a global community effort.", "description": "Python 3.15's JIT is finally starting to see real speedups on benchmarks. Core to that is a revamped JIT optimizer. *What* the JIT selects to compile and *how* it optimizes code has seen significant improvements thanks to the work of many contributors. In this talk, I will cover in-depth how the Python JIT optimizes your Python code, and how this was an amazing community team effort spanning multiple continents.", "bio": "", "tags": []}, {"id": "d1-09", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 8, "time": "11:40–12:10", "title": "Designing and Building Custom Keyboards ⌨️ with Python", "speakers": ["Carlos A Aranibar"], "level": "Intermediate", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "How to use Python to analyze your typing habits and design, build and program your own ergonomic custom keyboard.", "description": "Programmers spend countless hours typing, yet we rarely question how keyboard design affects our comfort and productivity. Standard QWERTY layouts and one-size-fits-all hardware often contribute to strain and inefficiency. This talk explores how Python can help you design, build, and optimize your own custom keyboard; from analyzing your typing habits to generating the PCB.\n\nWe start with a brief history of keyboard design and the limitations of QWERTY, then introduce alternative layouts (ortholinear, split, and more) and explain why they can reduce strain and improve speed. Next, we use Python to make data-driven decisions: scripts that analyze your codebases or IDE usage to find your most-used characters and symbols, so you can place keys where they matter most for your workflow and favorite languages.\n\nWe then move on to PCB design with KidCad and GDSFactory, a Python-based tool for creating keyboard PCBs and exporting Gerber or GDS files for manufacturing. You'll see how to arrange keys around your hand shape and generate production-ready files. After that, we cover basic assembly and programming your layout with open-source firmware. Finally, we discuss trade-offs: the benefits of a tailored setup (better posture, less finger travel, DIY satisfaction) — it can also be a meaningful accessibility solution for users with special needs, limited mobility, or other conditions where standard keyboards become uncomfortable or unusable. Some of the barriers (cost, time, learning a new layout), plus strategies for gradual adoption and practice tools.\n\n**What you will learn:** why keyboard layout and ergonomics matter for long-term comfort and productivity; how to use Python to analyze your typing patterns and inform layout choices; how to use KidCad or GDSFactory (Python) to design hardware and generate manufacturing files; how to go from design to assembly and firmware, and how to ease the transition to a new layout.\n\nNo prior experience with keyboard building or PCB design is required; just curiosity and a desire to create a custom typing experience.", "bio": "", "tags": []}, {"id": "d1-10", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 9, "time": "11:40–12:10", "title": "The Human-in-the-Loop is Tired", "speakers": ["Laura Summers"], "level": "Intermediate", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "An honest, personal account of LLM-era developer burnout, and concrete ideas for rebalancing human judgment against machine output.", "description": "A few nights ago I was up to 2am obsessively crafting an LLM plan. (*\"Just one more prompt!\"* - famous last words). Yet it still did something inexplicably stupid. 🫠 So yeah: LLMs are both genuinely useful and genuinely destabilising. Focusing on the first and ignoring the second is how people burn out.\n\nThis talk is an honest account of what it feels like to be a developer right now, from someone inside it, and some thoughts on what might actually help. My thesis: we've been optimising for *model output* when we need to be optimising for *human experience*.\n\nI'll share observations from my work, peers and colleagues. The peculiar fatigue of machine supervision: holding the intent in your head while the machine generates volumes of mostly-correct output that still needs your eyes, your judgment, and your taste. The way the satisfying part of the work shrank while the exhausting part grew. The isolation of pair-programming with a machine, and the loss of real human learning, interconnection and collaboration. And underneath all of it: uncertainty. About market conditions, about employability, about whether the skills we've spent years building will still matter.\n\nThe second half is about what's been working for me, and what hasn't. On the human side: encouraging pairing and teamwork even when the tools push you toward isolation, sharing the pain openly, naming the uncomfortable thing. On the technical side: structuring your environment to collaborate with LLMs more deliberately — writing plans, configuring project-specific rules. Learning when to stop prompting and just write code. And critically: rebalancing the push and pull of information so that you're directing your attention, not feeling at the mercy of the model's output. More Star Trek, less Black Mirror.\n\nLeave with concrete strategies for recalibrating your workflow, challenges to discuss and the reassurance that if you're finding this hard, you're not broken. The feedback loop is. And we can start fixing that.", "bio": "", "tags": []}, {"id": "d1-11", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 10, "time": "11:40–12:10", "title": "Exploring Python Inspect: Enriching Stack Traces and Testing the Untestable", "speakers": ["Mika Allert"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "How Python's inspect module can supercharge stack traces with runtime state and enable assertions standard testing frameworks can't express.", "description": "If your stack traces are missing crucial information about the runtime state of your program(s) or if you are developing tests which assert beyond the possibilities of common testing frameworks, then Python's `inspect` module can help you out. The `inspect` standard library puts the power to analyze the current execution context at your fingertips. For instance, you can supercharge your stack traces by enriching them with relevant variable values from any level of the call stack, saving you valuable time trying to debug and reproduce critical issues. In addition, `inspect` makes it easy to perform complex assertions about the execution of your code, such as from where a function is being called, whether a nested function behaves correctly, and what signature and context generated functions have.", "bio": "", "tags": []}, {"id": "d1-12", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 11, "time": "12:20–12:50", "title": "Property based testing with Hypothesis", "speakers": ["Freya Bruhin"], "level": "Intermediate", "duration": "30 minutes", "room": "Chambre Hall B (S3B)", "format": "talk", "summary": "An approachable introduction to property-based testing with Hypothesis, from random strings to complex generated data.", "description": "The [website](https://hypothesis.works) of the Hypothesis project used to boldly assert: *\"Normal 'automated' software testing is surprisingly manual. Every scenario the computer runs, someone had to write by hand. Hypothesis can fix this.\"*\n\nWhile it's debatable whether property-based testing should fully replace the manual parametrization of tests with different inputs and outputs, there's no doubt that Hypothesis is a powerful tool for uncovering bugs nobody would even have considered looking for. In fact, during its development, the authors of Hypothesis accidentally discovered countless bugs in CPython and libraries, thus coining the term *\"The Curse of Hypothesis\"*.\n\nThe framework, although incredibly powerful, might seem overwhelming at first. In this talk, I will demonstrate how even simply throwing random strings at functions can reveal surprising bugs. From there, we'll progress towards generating more complex data, which will be less daunting than it initially appears. You'll also see how Hypothesis seamlessly integrates with various ecosystems and can be a valuable tool in any developer's toolkit.", "bio": "", "tags": []}, {"id": "d1-13", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 12, "time": "12:20–12:50", "title": "Update on the CPython JIT: What to expect in 3.15", "speakers": ["Diego Russo"], "level": "Advanced", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "A follow-up look at how the CPython JIT has matured toward Python 3.15, including free-threading interaction and real-world performance.", "description": "This talk is a follow-up to my EuroPython 2025 session on the foundations of the CPython JIT compiler. It looks at how the JIT has evolved since Python 3.14 and where it stands as Python 3.15 approaches release. We cover the transition of the JIT from an experimental feature towards a supported part of CPython, how it fits into the runtime today, and what that means in practice for users and distributors. The talk also explores how the JIT interacts with free-threaded builds, the current status of integration with external debuggers, and how these constraints shape real-world usage. Finally, we examine how the JIT performs today, where it already delivers substantial speedups, where it does not, and what realistic performance expectations look like for Python 3.15.", "bio": "", "tags": []}, {"id": "d1-14", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 13, "time": "12:20–12:50", "title": "Friendly Borders: Graph algorithms reveal Eurovision voting patterns", "speakers": ["Domagoj Marić"], "level": "Intermediate", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "A graph-theory tour that uses Eurovision voting data to uncover hidden regional alliances and bias.", "description": "**Graphs** offer a powerful tool for uncovering relationships and hidden patterns between entities. This presentation provides an introduction to **graph theory**, and demonstrates how graphs are applied across various business domains - from social network analysis and recommendation systems to fraud detection and supply chain optimization. Through an overview of core concepts and algorithmic approaches, the goal is to show how graphs can reveal underlying structures in complex systems.\n\nAs a real-world case study, the presentation focuses on **Eurovision voting** - an area long suspected of regional bias and neighbourly favoritism. Using graph-based analysis and community detection techniques, we explore voting patterns between countries to better understand how geography, history, and politics influence the distribution of points. Through visualizations and data-driven insights, the talk demonstrates how graph theory uncovers hidden alliances and behavioral trends within the seemingly light-hearted spectacle of a music contest.", "bio": "", "tags": []}, {"id": "d1-15", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 14, "time": "12:20–12:50", "title": "From Code Hero to Team Leader: Learning to Let Go", "speakers": ["Manivannan Selvaraj"], "level": "Beginner", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "Practical advice for engineers who've become the team's single point of failure on how to shift from solving everything to enabling the team.", "description": "As engineers grow in their careers, many of us try to support our teams by writing more code, reviewing every pull request, and stepping in to fix the hardest problems. It feels helpful and responsible. Over time though, this approach can unintentionally create too much dependency on one person.\n\nThis talk explores the shift from being the person who solves everything to becoming someone who helps the whole team succeed.\n\nDrawing from lessons learned through experience (often the hard way) and from colleagues and mentors along the way, I will share practical shifts that make a difference: creating clearer technical direction, improving design conversations, sharing context early, mentoring thoughtfully and building systems that reduce reliance on any single \"hero.\"\n\nIf you are a mid or senior engineer who is always busy but still feels that too much depends on you, this talk aims to offer useful ideas for your own journey.", "bio": "", "tags": []}, {"id": "d1-16", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 15, "time": "12:20–12:50", "title": "Untangling the Web: Alternative Internet Protocols in Python", "speakers": ["Alan Velasco"], "level": "Beginner", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "An invitation into the Gemini-protocol 'Small Internet' and the Python tools, like Astronomo and Xitzin, that let you browse and build for it.", "description": "The web has grown into something its creators never imagined — a tangle of trackers, JavaScript bundles, and cookie consent banners standing between people and the content they came for. But alongside this bloated web, a quieter movement has been growing: the Small Internet. Communities of developers, writers, and tinkerers are building spaces that prioritize content over chrome, using protocols like Gemini that deliberately resist the complexity of the modern web. The Geminispace has grown from 200k unique URLs across 750 gemini capsules in 2021, to 530k URLs across almost 5,000 capsules at the time of writing.\n\nThis talk is an invitation to explore that world. We'll start with the \"why\" — what's driving people to seek alternatives to the modern web, and what the Small Internet's philosophy of intentional simplicity offers to developers who spend their days wrestling with ever-growing complexity. Then we'll get practical. The Gemini Protocol, created in 2019, sits in a sweet spot between Gopher's austerity and HTTP's complexity: using a simple TLS trust mechanism and a markup language called Gemtext, it's deliberately designed to resist feature creep. You'll learn how the protocol works, what Geminispace looks like from the inside, and how communities like Tilde servers carry on the collaborative spirit of early Unix.\n\nThe second half of the talk showcases how Python can be specially useful to interact with this space. Astronomo is a modern Gemini browser for the terminal, built with Textual, supporting Gemini, Gopher, and Finger protocols out of the box. On the server side, Xitzin is a framework for building Gemini applications: decorator-based routing, Jinja2 templates, and async support. A step-by-step walkthrough will show how to build a microblogging application from scratch: user accounts powered by Gemini's client certificate system (no passwords, no sign-up forms), posting through native input prompts, and threaded comments — all in under 100 lines of Python.\n\nYou don't need to abandon the web to appreciate what the Small Internet offers.", "bio": "", "tags": []}, {"id": "d1-17", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 16, "time": "12:20–12:50", "title": "Write async. Get sync for free", "speakers": ["Thom Lane"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "How Modal's open-source Synchronicity library lets you write a library once in async and get a clean blocking interface for free.", "description": "*(Sponsored session)*\n\nWhen you write a Python library, you have a dilemma. Ship async-only? Ship blocking-only? Or write everything twice and watch both copies drift?\n\n[Synchronicity](https://github.com/modal-labs/synchronicity) removes this dilemma. Write your library once (in async) and get a blocking interface for free, while avoiding the boilerplate and limitations of `asyncio.run()` wrappers. We'll talk through how to handle persistent connections, async generators, clean tracebacks, type hints and more.\n\nWe've used it in production at Modal for years, and it's fully open source. We hope it can save you from writing your own library twice!", "bio": "", "tags": ["sponsored"]}, {"id": "d1-18", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 17, "time": "12:50–13:50", "title": "Heuristic-Rule Based Model for Packet Loss Inference in IIoT Networks", "speakers": ["Oladapo Kayode Abiodun"], "level": "Intermediate", "duration": "60 minutes", "room": "Exhibit Hall (Poster)", "format": "poster", "summary": "A heuristic machine-learning model that distinguishes congestive from non-congestive packet loss to improve IIoT network throughput.", "description": "IIoT Networks' performance is significantly impacted by packet losses in the network, which is the failure of data packets in reaching their intended destination within the network. Most of the transmission control protocol versions reduce the rate of transmission during the detection of packet losses, assuming network congestion and interference, thus resulting in operational disruption, reduced efficiency, data integrity failure and economic impact.\n\nHowever, not all packet losses are due to congestions and interference; some happen based on link issues from wireless which are seen as non-congestive packet losses. Most TCP modifications reduce the rate of transmission when these losses are detected while assuming network congestion, so TCP could not at present distinguish among these types of packet losses, resulting in lower throughput for IIoT network clients.\n\nIn addressing this issue, a heuristic-rule-based machine learning model was used for packet loss identification, classification, and prediction to differentiate between the types of packet losses at the IIoT network hosts' end. The result shows that Random Forest performs better based on the rule, giving a hopeful resolution to an enhanced IIoT network's performance.", "bio": "", "tags": []}, {"id": "d1-19", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 18, "time": "12:50–13:50", "title": "Django TDD Patterns: A Visual Field Guide", "speakers": ["Kuldeep Pisda"], "level": "Intermediate", "duration": "60 minutes", "room": "Exhibit Hall (Poster)", "format": "poster", "summary": "A visual decision-tree poster of practical Django TDD patterns covering factories, permission testing, mock boundaries and common anti-patterns.", "description": "Most Django testing tutorials stop at \"write a test, make it pass, refactor.\" But real-world Django applications have complex model relationships, permission systems, third-party API integrations, and asynchronous task chains that demand more sophisticated testing strategies. This poster presents a visual field guide to practical TDD patterns in Django, organized as a decision-tree poster developers can reference when writing tests for their own projects.\n\n**Section 1 — The Factory Pattern Taxonomy.** A visual decision tree for choosing the right `factory_boy` strategy based on your model structure: `SubFactory` vs. `RelatedFactory` vs. `LazyAttribute` for foreign keys, handling circular relationships, and the `create` vs. `build` vs. `build_batch` decision.\n\n**Section 2 — Testing Permission Layers Without Drowning in Fixtures.** A visual matrix for structuring permission tests across user roles and resources, using parameterized tests with `pytest.mark.parametrize` and factory traits.\n\n**Section 3 — The Mock Boundary Diagram.** A flowchart showing where to place mocking boundaries in a Django request lifecycle, illustrating the difference between mocking at the view level, service layer, and adapter/client level.\n\n**Section 4 — Common Anti-Patterns and Fixes.** A visual rogues' gallery of the five most common Django testing anti-patterns with before/after code comparisons: test database leaks, over-mocking, unmaintainable fixture files, test ordering dependencies, and the \"God factory.\"\n\nVisitors will gain a practical decision framework for structuring Django tests. The patterns are tool-agnostic at their core (examples use `pytest-django`, `factory_boy`, and `faker`) and apply to any Django project.", "bio": "", "tags": []}, {"id": "d1-20", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 19, "time": "12:50–13:50", "title": "A tour of the module `itertools`", "speakers": ["Rodrigo Girão Serrão"], "level": "Beginner", "duration": "60 minutes", "room": "Exhibit Hall (Poster)", "format": "poster", "summary": "A guided poster tour of all 20 functions in itertools and how they work together.", "description": "This poster will take you on a tour of the 20 functions available in the module `itertools`, showing you how they work, how they interact with each other, and how they relate to each other.\n\nBy the time you're done reading the poster, you'll have an increased understanding of how to use the module `itertools` efficiently and effectively.", "bio": "", "tags": []}, {"id": "d1-21", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 20, "time": "13:50–14:20", "title": "Rethinking AsyncIO from scratch for free-threaded Python", "speakers": ["Giovanni Barillari"], "level": "Intermediate", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "A ground-up redesign of async Python, TonIO, aiming to combine trio-like ergonomics with true multi-threaded performance.", "description": "AsyncIO was designed with the Global Interpreter Lock (GIL) in mind: the event loop runs all of your async in a single thread, regardless of the GIL presence. Projects like trio focused on better ergonomics, but with a noticeable disadvantage in performance. What if we can have both?\n\nIn this talk we'll explore an alternative approach to async code in Python, redesigning the whole thing from the ground up, looking at what it takes — spoiler: way less than you think — to have simpler interfaces and multi-threaded support from day zero in a single package: TonIO.", "bio": "", "tags": []}, {"id": "d1-22", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 21, "time": "13:50–14:20", "title": "Why doing difficult things is good for you and good for your team", "speakers": ["Katie Bickford"], "level": "Beginner", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "A junior engineer's story of spending three weeks on an unfamiliar observability ticket, and why taking on hard things pays off for you and your team.", "description": "This talk shares my experience in my first ever role as a junior engineer after switching careers. I picked up a ticket involving tools and concepts I'd never used before (OpenTelemetry and Honeycomb), hoping to spend a day learning a bit about how we implement observability and monitoring of our Django app. Spoiler alert: it took three weeks of learning, debugging and asking for help to complete this work.\n\nThrough this talk, I want junior engineers in the audience to know: you can do difficult things, even if you think you lack the experience or knowledge required; doing difficult things is daunting but incredibly rewarding; taking on hard things benefits the whole team; there's a lot you can do to support yourself by reaching out early and often; and the value of your work cannot be measured by lines of code.\n\nThis talk also offers a reminder to seniors, leaders and managers about how tough it can be to be new, and how supportive teams make all the difference. This isn't a super technical talk — it's about the human experience of being a beginner, the value of persistence, why asking for help is a great thing to do, and the power of supportive teams.", "bio": "", "tags": []}, {"id": "d1-23", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 22, "time": "13:50–14:50", "title": "Security and Ethics in the Age of Generative AI", "speakers": ["Sylwia Budzynska", "Julien Lenormand", "Maria Lowas-Rzechonek", "Seth Michael Larson", "Maria Jose Molina-Contreras", "Mike Fiedler"], "level": "Beginner", "duration": "60 minutes", "room": "S3A (Panel)", "format": "panel", "summary": "A cross-disciplinary panel on how generative AI is reshaping cybersecurity, and the ethical questions that come with it.", "description": "This panel brings together experts from different corners of the field to talk about how generative AI is changing cybersecurity and the tricky challenges that come with it. Not only will we explore the technical aspects, but also the ethical considerations our society must have with in this rapidly evolving landscape.\n\nWe're not treating this as just a technical conversation. Generative AI in cybersecurity touches code, strategy, and ethics all at once, and we want to dig into all three. By the end of the panel, you should walk away with a clearer sense of the real risks at the language and ecosystem level, some practical lessons from teams working security operations day to day, and a more grounded take on the ethical questions this technology raises.", "bio": "", "tags": []}, {"id": "d1-24", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 23, "time": "13:50–14:20", "title": "Python and HTTP/3: feel the difference in performance", "speakers": ["Daniel Vahla"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "A live multiplayer Snake demo shows how HTTP/3 and WebTransport eliminate the head-of-line blocking that plagues WebSocket over TCP.", "description": "Building real-time Python applications, from live dashboards to multiplayer games, often feels like a battle against an invisible lag. While we focus on optimizing our async code, the underlying transport protocol often sabotages us: `TCP` guarantees ordering at the absolute cost of responsiveness.\n\nIn this session, I will show that the standard choice of using Websocket over `HTTP/1.1` or `HTTP/2` can make the application perform horribly, due to the \"head-of-line blocking\" problem that is visible when the network is unstable. Then I will present how `HTTP/3` and `WebTransport` eliminate transport-layer bottlenecks and enable seamless connection migration for network switching users. The audience will experience the difference between protocols performance firsthand through a live three-round multiplayer snake game demo.\n\n**The Problem:** Application performance is a complex challenge. Users often complain about lag, and regardless of how well we optimize our business logic, the issue persists. Even under ideal conditions, users experience disruptions simply by being mobile, due to switching between Wi-Fi access points or cellular towers.\n\n**Why This is Interesting to the Python Community:** As Python applications become more real-time and data-intensive, traditional networking stacks are reaching their limits. Using a combination of `Starlette` and `aioquic` code across three generations of transport protocols, the audience will experience and learn how protocol choice dictates application reliability on imperfect networks.\n\nKey takeaways: witness an app suffering from transport-layer head-of-line blocking; understand the Python `HTTP/3` ecosystem, including `aioquic`, `Hypercorn`, and `Starlette`; deploy an `HTTP/3` server handling `WebTransport` datagrams for real-time data; learn how to use Linux traffic control (`tc`) to inject chaos into the network; and play multiplayer Snake!", "bio": "", "tags": []}, {"id": "d1-25", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 24, "time": "13:50–14:20", "title": "How to blend Python, physics, and art to create (hopefully) pretty pictures", "speakers": ["Christian Leitold"], "level": "Beginner", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "Using Monte Carlo statistical-mechanics simulations and Matplotlib to turn a toy model of magnetism into art.", "description": "Sometimes, one writes code to answer an important scientific question. On other occasions, code is developed with some economic interest in mind, legitimate or otherwise. And then there are situations where something else is going on. This work, which I call *June Gloom*, is just that: something else. Specifically, it is about producing pretty pictures, inspired by very real analog art and executed by using a somewhat abstract toy model for magnetism from statistical mechanics. In my presentation, I will show how we can use Monte Carlo techniques to perform physically accurate computer simulations. The results obtained from these simulations are then turned into both static as well as interactive visualizations using Matplotlib.", "bio": "", "tags": []}, {"id": "d1-26", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 25, "time": "14:30–15:00", "title": "What every Python developer should know about the CPython ABI", "speakers": ["Nathan Goldbaum"], "level": "Intermediate", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "An explainer on the CPython ABI, why it matters for distributing native extensions, and how it's evolving for the free-threaded future.", "description": "Most developers interact with the CPython interpreter by writing code in the Python language and executing it with the bytecode interpreter. However, any native extensions and any code that runs alongside or embeds the interpreter needs to communicate with CPython via the CPython C API. This API corresponds to an application binary interface (ABI) that native code written in C, C++, Rust, Zig, or any other low-level programming language needs to use to directly interact with the CPython interpreter runtime. Understanding the ABI allows Python developers to make informed trade-offs when they distribute or depend on packages that contain native extensions.\n\nIn this talk, I will explain what the CPython ABI is, how it differs from the CPython C API, and how it determines whether a package from PyPI is installable with a given installation of CPython. I will discuss how CPython's stable ABI and limited C API enable substantially reduced distribution overhead at the cost of some performance overhead, and how maintainers can choose to ship wheels using the stable ABI to trade off peak performance with ease of distribution and support for new platforms.\n\nI'll finish by explaining how the ABI is evolving to enable improvements like the free-threaded interpreter, sharing real-world experience of introducing the new free-threaded ABI to the community. Python 3.15 will enable a new stable ABI that allows distributing one extension per platform for any interpreter newer than Python 3.15.", "bio": "", "tags": []}, {"id": "d1-27", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 26, "time": "14:30–15:00", "title": "Hacking Truth: Python and the Limits of Mathematics", "speakers": ["Miguel Ángel Fernández Gutiérrez"], "level": "Beginner", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "Using Python and algorithmic thinking to make Gödel's Incompleteness Theorems tangible.", "description": "Are mathematics a reliable way to explain reality? Can we trust them? And more importantly: what role could Python play in such profound questions?\n\nGödel's Incompleteness Theorems are pillars of mathematics and computer science, revealing inherent limits in our ability to formalize truth and reason about the world. Their implications reach far beyond logic, touching philosophy, the foundations of computing, and the limits of machine reasoning. Despite their importance, understanding *why* these results hold can feel inaccessible and abstract.\n\nIn this talk, we tackle that difficulty directly. Python will be used not only as a programming language, but as a conceptual tool to understand Gödel's First Incompleteness Theorem through algorithmic thinking.\n\nWe will see how computational ideas make abstract concepts tangible, exploring the intellectual journey from Hilbert's dream of a complete mathematics to the breakthroughs of Gödel, Church, and Turing. Through this lens, Python helps illuminate the boundaries of logic and computation, offering a new perspective on how mathematics works... and where its limits lie.", "bio": "", "tags": []}, {"id": "d1-28", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 27, "time": "14:30–15:00", "title": "I Am a Sucker for Conventions. Why Django's Defaults Work, Until They Don't", "speakers": ["David Vaz"], "level": "Beginner", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "An exploration of Django's conventions as both a superpower and a constraint, and when it's okay to bend the 'Django way'.", "description": "Conventions are one of Django's greatest strengths. They simplify our day-to-day work, reduce cognitive load, and let teams move fast with confidence. By following well-established defaults, we spend less time debating structure and more time solving real problems.\n\nBut every convention is also a decision - and every decision has trade-offs. Who decided these conventions? Why were they chosen? And what happens when your problem doesn't quite fit the \"Django way\"?\n\nIn this talk, we'll explore Django's conventions as both a feature and a constraint. We'll look at where they shine, where they leak, and how experienced developers can respectfully bend (or break) them without fighting the framework. This is a talk for anyone who loves Django — especially when they disagree with it.", "bio": "", "tags": []}, {"id": "d1-29", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 28, "time": "14:30–15:00", "title": "Beyond `Optional` in Real-World Projects: Missing, `None`, and Unset", "speakers": ["Koudai Aono"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "A practical typing guide to distinguishing missing, None, and unset values with TypedDict, dataclasses, and sentinel patterns.", "description": "Have you ever merged a config file, applied an input that says \"update only these fields\", or handled an API payload, only to overwrite data because \"missing\", `None`, and \"unset\" were treated as the same thing?\n\nIn real-world projects, \"no value\" has at least three meanings: a missing key (the field is absent), an explicit `None` (the value is present and intentionally null), and an unset input (the caller didn't specify the field, so you must not touch it). When we collapse these into `T | None` or fall back to `dict[str, Any]`, type checking becomes noisy, branching becomes fragile, and refactors get risky.\n\nThis is a practical talk about using typing to model and safely consume real-world data with `TypedDict` and `dataclasses`. We'll walk through one end-to-end example (payload -> normalization -> domain model -> safe updates) with before/after code, covering: using `Required` / `NotRequired` to model missing keys instead of abusing `T | None`; using `T | None` only when `None` is a meaningful value; representing unset inputs with a sentinel pattern (`UNSET = object()`, optionally evolving to `typing_extensions.Sentinel`); and keeping extraction code honest with type aliases, `TypeIs`, and `match` cases.\n\nAfter this session, you'll be able to define stricter data models, write safer extraction code, and make schema changes less painful.", "bio": "", "tags": []}, {"id": "d1-30", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 29, "time": "15:25–15:55", "title": "Rust for High Performance Computing (HPC) in Python", "speakers": ["Cheuk Ting Ho"], "level": "Intermediate", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "How PyO3-based Rust bindings can remove Python's HPC performance bottlenecks while keeping distribution simple.", "description": "Python has become the most widely used language in scientific computing and data science due to its approachable syntax, vast ecosystem of libraries, and rapid prototyping capabilities. However, its interpreted nature often poses a performance bottleneck for computationally intensive tasks common in High Performance Computing (HPC), such as large-scale simulations, complex data analysis, and machine learning model training.\n\nIn this talk, we will review the current state of Python in HPC, examine the role of key libraries like NumPy and Dask, and see how to use PyO3 to create robust Rust bindings for Python in a way that simplifies the process of building and distributing packages. We'll explore how Rust brings specific advantages to HPC, including guaranteed memory safety without garbage collection, zero-cost abstractions, and true parallelism.\n\nAttendees will leave with a clear understanding of the 'why' and 'how' of leveraging Rust in their Python-based HPC workflows, positioning them to develop faster, safer, and more scalable computational code.", "bio": "", "tags": []}, {"id": "d1-31", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 30, "time": "15:25–15:55", "title": "uvx which-profiler – Which Profiler, When", "speakers": ["Jonathan Striebel"], "level": "Intermediate", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "A tour of the Python profiler landscape, from py-spy and Scalene to memray and Tachyon, and how to pick the right one.", "description": "Want to know what makes your code slow? How much memory it actually uses? You reach for a profiler, but which one?\n\nIn this talk, we navigate the landscape of Python profilers, from classics like py-spy, Scalene and memray to newer tools like Tachyon, and work out when to use which. We cover timing and memory profiling methodologies, the sampling vs instrumentation distinction, and compare tools across multiple axes: accuracy and overhead, output format, native extension and thread support, and how well their output fits into agentic coding workflows. We also touch on the Linux perf profiler, eBPF-based profilers and continuous profiling for production systems.\n\nWalk away with a profiler or two you hadn't tried before, a clearer sense of when to use which, and a CLI tool to help you decide next time you're unsure where to start.", "bio": "", "tags": []}, {"id": "d1-32", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 31, "time": "15:25–15:55", "title": "Designing Performant APIs with Litestar", "speakers": ["Julien Courtès", "Cody Fincher"], "level": "Beginner", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "Design principles, illustrated with Litestar, for keeping Python APIs fast as they scale in endpoints, traffic and data.", "description": "APIs development start simple, feel fast, and ship quickly. Then the API grows: more endpoints, more traffic, more data, and suddenly performance becomes unpredictable. Latency creeps in, async code blocks without anyone noticing, and every new feature feels a little riskier to add.\n\nThis talk is about building Python APIs that stay fast *as they evolve*. We'll look at where performance issues really come from in real-world APIs: request lifecycle overhead, hidden blocking calls, dependency injection costs, serialization, and poorly scoped middleware. Instead of chasing micro-optimizations or benchmark numbers, we'll focus on design decisions that make performance predictable.\n\nUsing Litestar as a concrete example, you'll see how explicit control over routing, dependencies, and async execution helps avoid common performance traps. We'll walk through realistic API patterns and show how to structure handlers and dependencies so performance problems don't slowly accumulate.\n\nEven if you don't use Litestar today, the design principles in this talk will help you reason more clearly about performance in any Python API.", "bio": "", "tags": []}, {"id": "d1-33", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 32, "time": "15:25–15:55", "title": "How many spoons does your environment cost: Broken demos & human element", "speakers": ["Dawn Wages"], "level": "Beginner", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "A live, deliberately-broken-demo talk about how Python environment friction becomes an accessibility barrier, not just an inconvenience.", "description": "This talk is one part technology dance and one part walk through of Python environment best practices. In under 30 minutes, you'll see me load up some of the most gnarly environments and watch them fail. This isn't just another talk about dependency management. It's about the hidden cost of environment friction: the cognitive load, the lost spoons, the brilliant developers who almost quit tech because they felt \"too stupid\" to make pip work. It's about recognizing that setup barriers aren't just inconvenient—they're accessibility barriers that determine who gets to write Python.\n\nIn this talk we'll cover: several environment failures (with dramatic audience participation) including GPU-enabled errors, OS errors, mounted systems, CI/CD and virtual environments; the human side of technical frustration (spoon theory, burnout); patterns about how environments break; and what the Python community is doing to lower these barriers.\n\nContent note: This talk discusses mental health, burnout, and the emotional impact of technical barriers with care and intention.", "bio": "", "tags": ["content-note"]}, {"id": "d1-34", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 33, "time": "15:25–15:55", "title": "DuckLake - Take Python and DuckDB for a swim in your data lake", "speakers": ["Marc-André Lemburg"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "How DuckDB and its DuckLake extension bring data-lake features like snapshots and time travel to a single laptop, no cloud infra required.", "description": "With DuckDB and DuckLake, managing and analyzing huge data sets is no longer limited to complex cloud infrastructure setups. You can literally run these tasks on your notebook now and at comparable speeds. This talk will show you how.\n\n**DuckDB** is an embedded relational analytics database (OLAP) which can be added to a Python project with a simple `uv add duckdb` or `pip install duckdb`. It is both fast and powerful for processing analytical data warehouse workloads, using the well-known PostgreSQL SQL dialect. DuckDB is well integrated with Polars via zero copy Apache Arrow data structures, making it a great choice for complex data science and engineering tasks.\n\n**DuckLake** is an extension which comes with DuckDB to add data lake features, meaning huge data sets can be managed using Parquet files stored on disk or in an object store such as S3. It uses a novel approach to data lakes in that the management structures are stored in a database (DuckDB), instead of complex file and directory structures. This provides great advantages for implementing smart features such as snapshots, schema evolution or time travel.\n\nThe talk will give a short introduction to the database terminology, explain what is novel about the DuckLake approach and then showcase a typical use case for lake houses: storing historical weather data and making this available for analytics to Python applications. Both DuckDB and DuckLake are MIT licensed.", "bio": "", "tags": []}, {"id": "d1-35", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 34, "time": "16:05–16:35", "title": "Demystifying CRA for the community", "speakers": ["Anwesha Das"], "level": "Beginner", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "A lawyer-engineer explains what the EU Cyber Resilience Act actually means for open-source maintainers ahead of its 2026 deadline.", "description": "September 2026, a month after EuroPython, the first wave of legal obligations for the EU Cyber Resilience Act (CRA) will wash over the software world. For us in the open-source community, CRA has been a source of major confusion, dilemma, and anxiety:\n\n- 'Will my hobby project make me liable?'\n- 'Is my Python package \"commercial activity\"?'\n- 'Will PSF be liable for your code?'\n- 'Do I really need an SBOM for a Python library?'\n\nIn this talk I, a lawyer, engineer, and FOSS alumni, will cut through the legal jargon to explain what the CRA actually is, why it exists, and how it changes the \"manufacturer\" relationship with open-source code. We will walk through the new legal roles—from Manufacturers to the newly defined \"Stewards\"—and provide a clear \"To-Do and Not-To-Do\" list for community maintainers. Whether you are a solo contributor or part of a major foundation, this session will help you navigate the 2026–2027 transition period with confidence.", "bio": "", "tags": []}, {"id": "d1-36", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 35, "time": "16:05–16:35", "title": "The hardest test suite I ever built - a pytest case study", "speakers": ["Grzegorz Kocjan"], "level": "Advanced", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "How a layered pytest architecture brought statistical, reproducible verification to a non-deterministic real-time video system.", "description": "For years, this real-time video system had no tests. Every change produced unpredictable side effects. Accuracy drifted. Production incidents and escalations followed. The only \"verification\" was manual inspection and hope.\n\nWhen I joined the project, this was the reality - and building a proper integration test suite became my first priority. In this talk, I'll share how I designed and evolved the hardest integration test suite of my career using pytest - and kept it readable.\n\nThe system processed live streams in production. It was non-deterministic. Individual detections were only 80–90% accurate. For testing, we replayed recorded scenarios to make system behavior observable and comparable across runs. But binary assertions were not enough. A single failed event did not mean the whole system was broken - but we needed a way to measure when it actually was.\n\nInstead of writing one massive test, I built a layered architecture: dual parametrization (recording scope and event scope), orchestration in fixtures with assertions in tiny, single-purpose tests, statistics collection during execution, and end-of-run aggregation that summarizes system accuracy.\n\nThe result was a suite that could detect regressions in model changes and produce reproducible evidence - HTML reports, structured dumps, and a summary statistics file. This talk explores how far pytest can be stretched beyond unit tests - into a framework for architecting complex integration systems.", "bio": "", "tags": []}, {"id": "d1-37", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 36, "time": "16:05–16:35", "title": "How to Maintain 60 Integrations and Not Go Bananas", "speakers": ["Ivana Kellyer"], "level": "Beginner", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "Lessons on detecting upstream breakage early across 60+ third-party integrations, without relying on users as your release monitor.", "description": "Say you've built a library whose main value is providing built-in integrations with a considerable number (say 60+) of different Python packages. That's cool, and your users are loving the out-of-the-box experience. Everything seems to be working fine, you get the odd bug report or feature request, the usual.\n\nThen one day you wake up and your otherwise fairly chill issue tracker is drowning in folks experiencing an issue with your library that breaks their app. All the third party code you're integrating with? It's become *your* code by extension. You need to react if something changes upstream and breaks your integration in unexpected ways. You can write your integrations so defensively that no one will ever want to read them again, but it's not enough: you can't anticipate every single change each of the 60+ packages will ever make.\n\nLet's assume having your users act as a release monitoring system by notifying you on your issue tracker is not what you want. How do you go about this? You'll want somehow to detect breakage early, so you can go fix things before your users are hit by them, and ideally in a way that maintaining it is not a nightmare.\n\nThis talk will take you through one such journey, from recognizing the problem, to various attempts at making it better, to eventually arriving at a solution that's good enough for now (tm).", "bio": "", "tags": []}, {"id": "d1-38", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 37, "time": "16:05–16:35", "title": "How much do you really need to know about Databases?", "speakers": ["Karen Jex"], "level": "Beginner", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "A reassuring guide to the minimum database knowledge Python developers actually need as the DBA role fades away.", "description": "Most developers have to interact with databases at some point, and therefore need to know at least a little bit about them, but probably don't have much training or experience in that area. I've worked with databases for over 25 years because I love them so much, but I'm aware that most people don't feel the same way!\n\nAs a Python developer, you probably just want the database to quietly do its thing in the background so you can concentrate on coding. That seems like a reasonable request. But the world of databases is changing. The traditional DBA role is becoming less common, and developers are increasingly expected to manage their own databases.\n\nSo let's talk about what you actually need to know about databases. You should come away reassured that, although it helps to have a smattering of database knowledge, you don't need to be a database expert. We'll explore the minimum that you *do* need to know, and look at where you can find more information or help when you need it.", "bio": "", "tags": []}, {"id": "d1-39", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 38, "time": "16:05–16:35", "title": "Zero to Pipeline: When Data Connectors Just Work", "speakers": ["olusola akinsulere"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "t
