/* ---------- Export / Import favorites ---------- */
function showToast(msg, isError){
  var old = document.querySelector('.toast');
  if (old) old.remove();
  var el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3600);
}

function exportFavorites(){
  var favIds = getFavorites();
  if (!favIds.length){
    showToast('No starred talks to export yet.', true);
    return;
  }
  var favTalks = favIds.map(function(id){ return TALK_BY_ID[id]; }).filter(Boolean);
  var payload = {
    app: 'europython-2026-guide',
    version: 1,
    exportedAt: new Date().toISOString(),
    favorites: favIds,
    talks: favTalks.map(function(t){ return {id:t.id, title:t.title, day:t.dayName}; })
  };
  var text = JSON.stringify(payload);
  copyTextToClipboard(text).then(function(){
    showToast('Copied ' + favIds.length + ' starred talk' + (favIds.length===1?'':'s') + ' to clipboard.');
  }).catch(function(){
    showToast('Could not access the clipboard.', true);
  });
}

function copyTextToClipboard(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(resolve, reject){
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand failed'));
    } catch(e){ reject(e); }
  });
}

function triggerImport(){
  handleImportFromClipboard();
}

function applyImportedFavorites(clipText){
  var parsed;
  try { parsed = JSON.parse(clipText); }
  catch(e){ showToast('Clipboard does not contain valid JSON.', true); return; }

  var incoming;
  if (Array.isArray(parsed)) incoming = parsed;
  else if (parsed && Array.isArray(parsed.favorites)) incoming = parsed.favorites;
  else { showToast('Could not find a favorites list in the clipboard.', true); return; }

  var valid = incoming.filter(function(id){ return typeof id === 'string' && TALK_BY_ID[id]; });
  var unknown = incoming.length - valid.length;
  var existing = getFavorites();
  var added = valid.filter(function(id){ return existing.indexOf(id) === -1; });
  var merged = existing.concat(added);
  setFavorites(merged);

  var msg = 'Imported ' + added.length + ' new talk' + (added.length===1?'':'s') +
    (unknown ? (' (' + unknown + ' unrecognized entr' + (unknown===1?'y':'ies') + ' skipped)') : '') +
    '.';
  showToast(msg, added.length === 0 && unknown > 0);
  render();
}

function handleImportFromClipboard(){
  if (navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(clipText){
      applyImportedFavorites(clipText);
    }).catch(function(){
      showToast('Could not read the clipboard. Your browser may need permission — try pasting manually.', true);
    });
  } else {
    showToast('Clipboard reading is not supported in this browser.', true);
  }
}

function computeRecommendations(limit){
  limit = limit || 9;
  var favIds = getFavorites();
  if (!favIds.length){
    var picks = TALKS.filter(function(t){ return t.format === 'keynote' || t.format === 'panel'; }).slice(0, limit);
    return picks.map(function(t){ return {talk:t, reason:"Editor's pick — a keynote/panel highlight"}; });
  }
  var favTalks = TALKS.filter(function(t){ return favIds.indexOf(t.id) !== -1; });
  var favSpeakerSet = {};
  favTalks.forEach(function(t){ t.speakers.forEach(function(s){ favSpeakerSet[normalizeSpeaker(s)] = true; }); });
  var favFormats = {}; favTalks.forEach(function(t){ favFormats[t.format] = true; });
  var favLevels = {}; favTalks.forEach(function(t){ favLevels[t.level] = true; });
  var favWords = {};
  favTalks.forEach(function(t){ keywordsOf(t).forEach(function(w){ favWords[w] = true; }); });

  var scored = TALKS.filter(function(t){ return favIds.indexOf(t.id) === -1; }).map(function(t){
    var score = 0, reasons = [];
    var spk = t.speakers.map(normalizeSpeaker);
    var sameSpeaker = spk.filter(function(s){ return favSpeakerSet[s]; });
    if (sameSpeaker.length){ score += 5; reasons.push('by ' + sameSpeaker[0] + ', a speaker you starred'); }
    if (favFormats[t.format]){ score += 1; }
    if (favLevels[t.level]){ score += 1; }
    var kws = keywordsOf(t).filter(function(w){ return favWords[w]; });
    if (kws.length){ score += Math.min(kws.length, 3); reasons.push('related topics: ' + kws.slice(0,2).join(', ')); }
    if (!reasons.length && score > 0) reasons.push('similar level & format to your picks');
    return {talk:t, score:score, reason: reasons[0] || ''};
  }).filter(function(r){ return r.score > 0; });

  scored.sort(function(a,b){ return b.score - a.score; });
  return scored.slice(0, limit);
}

function renderRecommended(){
  var recos = computeRecommendations(12);
  var favIds = getFavorites();
  var html = '<h2 class="section-title">✨ Recommended for you</h2>';
  if (!favIds.length){
    html += '<p class="section-sub">Star a few talks and this list will tailor itself to your interests. For now, here are some highlights.</p>';
  } else {
    html += '<p class="section-sub">Based on the ' + favIds.length + ' talk' + (favIds.length===1?'':'s') + ' you starred — matching speakers, topics, level and format.</p>';
  }
  if (!recos.length){
    html += '<div class="empty-state"><div class="big">🤷</div>Nothing to recommend yet — try starring a talk or two.</div>';
  } else {
    html += '<div class="grid">' + recos.map(function(r){ return cardHtml(r.talk, {reason:r.reason}); }).join('') + '</div>';
  }
  document.getElementById('mainContent').innerHTML = html;
}

    if (document.getElementById('fSort')) document.getElementById('fSort').value = state.sort;
    document.getElementById('fFavOnly').checked = state.favoritesOnly;

    document.getElementById('fDay').onchange = function(e){ state.day = e.target.value; render(); };
    document.getElementById('fLevel').onchange = function(e){ state.level = e.target.value; render(); };
    document.getElementById('fFormat').onchange = function(e){ state.format = e.target.value; render(); };
    document.getElementById('fRoom').onchange = function(e){ state.room = e.target.value; render(); };
    if (document.getElementById('fSort')) document.getElementById('fSort').onchange = function(e){ state.sort = e.target.value; render(); };
    document.getElementById('fFavOnly').onchange = function(e){ state.favoritesOnly = e.target.checked; render(); };
    document.getElementById('clearFilters').onclick = function(){
      state.day='all'; state.level='all'; state.format='all'; state.room='all';
      state.favoritesOnly=false; state.sort='schedule'; state.query='';
      document.getElementById('searchInput').value='';
      render();
    };
  } else {
    el.style.display = 'none';
    el.innerHTML = '';
  }
}

/* ---------- Master render ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(function(btn){
    btn.classList.toggle('active', btn.dataset.view === state.view);
  });
  renderFilterBar();
  updateStarCount();

  if (state.view === 'overview') renderOverview();
  else if (state.view === 'timeline') renderTimeline();
  else if (state.view === 'starred') renderStarred();
  else if (state.view === 'recommended') renderRecommended();
  else if (state.view === 'speakers'){
    if (state.selectedSpeaker) renderSpeakerDetail(state.selectedSpeaker);
    else renderSpeakersList();
  }
}

/* ---------- Events ---------- */
document.getElementById('tabs').addEventListener('click', function(e){
  var btn = e.target.closest('.tab');
  if (!btn) return;
  state.view = btn.dataset.view;
  if (state.view !== 'speakers') state.selectedSpeaker = null;
  render();
});

document.getElementById('searchInput').addEventListener('input', function(e){
  state.query = e.target.value.trim();
  render();
});

document.getElementById('themeToggle').addEventListener('click', function(){
  setTheme(getTheme() === 'dark' ? 'light' : 'dark');
});

document.getElementById('exportBtn').addEventListener('click', exportFavorites);
document.getElementById('importBtn').addEventListener('click', triggerImport);

document.getElementById('mainContent').addEventListener('click', function(e){
  var exportBtn = e.target.closest('[data-action="export-favorites"]');
  if (exportBtn){ exportFavorites(); return; }
  var importBtn = e.target.closest('[data-action="import-favorites"]');
  if (importBtn){ triggerImport(); return; }
  var starBtn = e.target.closest('[data-star]');
  if (starBtn){
    e.stopPropagation();
    toggleFavorite(starBtn.dataset.star);
    render();
    return;
  }
  var speakerCard = e.target.closest('[data-speaker]');
  if (speakerCard){
    state.selectedSpeaker = speakerCard.dataset.speaker;
    render();
    return;
  }
  var backBtn = e.target.closest('#backToSpeakers');
  if (backBtn){
    state.selectedSpeaker = null;
    render();
    return;
  }
  var openBtn = e.target.closest('[data-open]');
  if (openBtn){
    openModal(openBtn.dataset.open);
    return;
  }
  var calEvent = e.target.closest('.cal-event');
  if (calEvent){
    openModal(calEvent.dataset.id);
    return;
  }
  var card = e.target.closest('.card');
  if (card){
    openModal(card.dataset.id);
  }
});

document.getElementById('modalRoot').addEventListener('click', function(e){
  if (e.target.id === 'modalOverlay' || e.target.id === 'modalCloseBtn'){
    closeModal();
    return;
  }
  var starBtn = e.target.closest('#modalStarBtn');
  if (starBtn){
    toggleFavorite(starBtn.dataset.id);
    var t = TALK_BY_ID[starBtn.dataset.id];
    var fav = isFavorite(t.id);
    starBtn.classList.toggle('active', fav);
    starBtn.textContent = fav ? '★ Starred' : '☆ Star this talk';
    render();
    return;
  }
  var chip = e.target.closest('.speaker-chip[data-speaker]');
  if (chip){
    closeModal();
    state.view = 'speakers';
    state.selectedSpeaker = chip.dataset.speaker;
    render();
  }
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeModal();
});

/* ---------- Init ---------- */
setTheme(getTheme());
updateStarCount();
render();

})();

</script>
<script>
// Registers the offline service worker when hosted (e.g. GitHub Pages).
// On a plain double-clicked local file, registration silently no-ops —
// the app already works fully offline without it in that case.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
