ork. It's also a chance to meet fellow organizers before we dive into the conversations ahead.", "bio": "", "tags": []}, {"id": "d3-08", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 7, "time": null, "title": "How Music Generation Actually Works", "speakers": ["Mateusz Modrzejewski"], "level": "Beginner", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "A jargon-free walkthrough of how AI music generation works, from neural audio codecs to token prediction versus diffusion, and its open legal questions.", "description": "Music generation has gone from a research curiosity to something you can try in a browser. Commercial platforms and open source models can produce full songs from a text prompt. Between the hype and the technical papers, it's hard to get a straight answer about what's actually going on under the hood. **This talk is a clear, honest walkthrough of how music generation systems work, in simple language**, no deep machine learning knowledge needed.\n\nWe start with the core challenge: how do you turn a continuous audio signal into something a generative model can work with? Neural audio codecs solve this by compressing waveforms into sequences of discrete tokens, and this idea is the foundation everything else builds on. From there, we look at the two main modeling strategies: token prediction and diffusion. We compare what each does well, where it struggles, and why the choice between them matters.\n\nOn the practical side, we walk through the open source models and Python tools available today, and what you can build with them. Then we get into evaluation, one of the most important open problems in the field. Current metrics only tell part of the story, and there is no standard benchmark for comparing systems. This has real consequences for how research moves forward and how models get used.\n\nWe close with a discussion that often gets skipped: how artists and musicians see these tools, what legal questions remain around training data and copyright, and why these conversations matter for the future of the field.", "bio": "", "tags": []}, {"id": "d3-09", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 8, "time": null, "title": "Plugins in python - how it is done", "speakers": ["Grzegorz Bokota"], "level": "Intermediate", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "How entry-points in Python package metadata power plugin discovery in tools like pytest and tox, and how to build your own.", "description": "Have you ever wondered how popular tools like pytest or tox are able to discover and use plugins?\nIn this talk we will learn about entry-points in Python package metadata and how they enable plugin discovery.\nWe will review how some popular projects are using this mechanism to create their plugin systems.\nAfter a walkthrough of the basics, we will explore how you can use this to create a plugin mechanism for your own project.\nWe will explore possible hook implementations and their advantages and disadvantages.\nFinally we will learn how to make plugins discoverable on PyPi.", "bio": "", "tags": []}, {"id": "d3-10", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 9, "time": null, "title": "Breaking changes – not great, not terrible", "speakers": ["Jan Musílek"], "level": "Intermediate", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "Practical strategies for versioning, deprecating, and rolling out unavoidable breaking changes in Python libraries and APIs.", "description": "Do you maintain a Python library, REST API or any other user-facing interface? Breaking changes are frowned upon, but from a a certain project size, they become unavoidable.\n\nHow do you make the breaking changes manageable? How should you version your package / API? Should you put an upper bound on your dependencies?\n\nWe'll discuss deprecation, forward and backward compatibility, upgrade strategies and more, illustrated on real-world examples. Our main focus will be on API changes of Python libraries, but the principles are widely applicable.", "bio": "", "tags": []}, {"id": "d3-11", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 10, "time": null, "title": "Is Object Detection Dead? A Case for Recognizing LEGO Bricks", "speakers": ["Piotr Rybak"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "A stress test of classic object detectors against SAM 3 and vision-language models on the brutal task of recognizing 90,000+ LEGO bricks.", "description": "With the rise of foundation models and zero-shot segmentation, it sometimes feels like fine-tuning classic object detection models is outdated. But is it? There are over 90 000 different LEGO bricks produced in almost 200 colors, and a single photo can easily contain hundreds of bricks. This makes LEGO recognition a perfect stress test for both traditional object detectors and the latest generation of vision models.\n\nDuring this talk, I will walk you through a practical comparison of approaches to LEGO brick detection. I will start with the classic object detection pipeline: dataset creation, annotation, and training with models like NanoDet and RF-DETR. Then, I will put these detectors up against zero-shot approaches: SAM 3 (Segment Anything Model 3), and vision language models, both closed-source APIs like Gemini and open-source alternatives like Qwen-VL. Along the way, I will share the pitfalls, surprising results, and lessons learned, including cases where a fine-tuned lightweight detector still outperforms models orders of magnitude larger.", "bio": "", "tags": []}, {"id": "d3-12", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 11, "time": null, "title": "Refactor, Optimize, and Test: Crafting Cleaner Python Code", "speakers": ["Mohamed Elmaghraby"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "A practical guide to code smells, refactoring, and profiling, inspired by Martin Fowler's work, for cleaning up legacy Python code.", "description": "In software development, messy, outdated, or inefficient code is inevitable. We have to deal daily with old code that has not been touched for years, refactoring allows us to keep the code maintainable and easy to extend without altering its functionality, and it plays a crucial role in enhancing maintainability, readability, and performance.\n\nThis session explores the how, when, and why of code refactoring with code smell examples, coupled with practical insights on performance profiling techniques, tools and how it affects Refactoring. Also exploring how testing is very crucial when it comes to Refactoring.\n\nWhether you're dealing with legacy code or looking to enhance your development workflows, this talk equips you with the tools and techniques to write cleaner, more efficient Python code.\n\nThis session is inspired by Martin Fowler's seminal works on refactoring and Python-specific insights shared at EuroPython 2024.", "bio": "", "tags": []}, {"id": "d3-13", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 12, "time": null, "title": "Discussion session", "speakers": ["Kshitijaa Jaglan", "Naa Ashiorkor", "Ege Akman"], "level": "Beginner", "duration": "90 minutes", "room": "F0 (Glass Room)", "format": "discussion", "summary": "Facilitator-led breakout discussions on sponsorship, AI-era sustainability, and diversity & inclusion in open source.", "description": "Participants will split into facilitator-led discussion groups based on their interests. Each group will explore a different area of interest, sharing experiences, discussing common challenges, and exchanging practical ideas.\n\nThe discussion topics are: **Sponsorship** facilitated by **Kshitijaa Jaglan** **Sustainability in the AI Era** facilitated by **Ege Akman** **Diversity & Inclusion Challenges** facilitated by **Naa Ashiorkor**\n\nEach group will have a facilitator to guide the discussion, encourage participation, and capture the key takeaways to be shared later in the day.", "bio": "", "tags": []}, {"id": "d3-14", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 13, "time": null, "title": "Become a Python Core Developer in 3 Easy Steps", "speakers": ["Tomas Roun"], "level": "Beginner", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "A core developer's story of going from fixing one obscure unittest bug to working on the JIT compiler, and how you can start contributing too.", "description": "Step 1: Fix a bug\nStep 2: ???\nStep 3: Core developer\n\nOk, it's not that simple but it's also not as mysterious as it might seem!\n\nAbout three years ago I fixed an obscure bug in the unittest module. Today, I'm a core developer. This talk is about what happened in between, and how you can start contributing too!\n\nOver the years, I got to work on many different areas of Python. I've fixed bugs in the parser, added import autocomplete to the REPL, worked on gettext tooling, and eventually found my way to the JIT compiler, all things I knew little about before diving in.\n\nGetting started contributing to CPython can be intimidating, so I'll share some practical things I learned along the way. At the same time, I will spend some time talking about the whole process of how does one go from being \"just\" a Python user to becoming a Core developer (with stats included).\n\nIf you've ever wanted to contribute to Python but weren't sure where to start, this talk is for you!", "bio": "", "tags": []}, {"id": "d3-15", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 14, "time": null, "title": "Python in the Service of Justice: Modern Analysis Tools in Forensics", "speakers": ["Aleksander"], "level": "Intermediate", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "A tour of Python's role in digital forensics — parsing chat databases, analyzing memory dumps, and generating expert reports.", "description": "The presentation will discuss practical applications of Python in technologies used in forensic science. In an era of growing cybercrime and digitalization of evidence, Python has become an essential tool for forensics specialists, offering powerful libraries for data analysis, process automation and processing complex information structures. Participants will gain insights into spanning multiple domains of forensic investigation, including:\n\n- mobile device analysis,\n- network traffic examination,\n- memory forensics,\n- automated report generation.\n\nWe will analyze how Python libraries parse SQLite databases in messaging applications like WhatsApp and iMessage, also examine tools for analyzing iOS file formats including PLIST and XML structures and techniques for extracting data from disk images using pytsk3 or libewf. Network analysis will showcase Scapy for packet analysis and Dpkt for parsing capture files, demonstrating how Python analyzes Windows Event Logs and Linux syslog to reconstruct activity timelines.\n\nMemory forensics will be explored through the Volatility Framework for analyzing RAM dumps and recovering volatile data. We will discuss recovering deleted files, extracting metadata, and analyzing browser artifacts. Cryptographic analysis using hashlib will demonstrate integrity verification, encrypted file analysis, and cipher breaking techniques essential for maintaining chain of custody.\nData visualization using Matplotlib, Seaborn, and NetworkX will show how to create compelling visual representations of timelines and connection networks. Automated report generation with ReportLab and python-docx streamlines professional expert report creation.\n\nThe presentation emphasizes real-world applications with dusscussion about Python scripts processing realistic datasets, illustrating how multiple Python tools integrate into comprehensive investigation workflows, demonstrating the synergistic effects of combining different analytical approaches for actionable forensic intelligence.", "bio": "", "tags": []}, {"id": "d3-16", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 15, "time": null, "title": "Sponsor Highlight & Recruitment Fair", "speakers": [], "level": "Beginner", "duration": "60 minutes", "room": "S3A", "format": "social", "summary": "Sponsors introduce their teams, what they're building, and who they're hiring, followed by Q&A and booth conversations.", "description": "Many of our sponsors are looking for people from a wide range of backgrounds and experience levels to join their teams. This session is a chance to hear directly from companies about what they are building, the kinds of people they are looking for, and what it's like to work with them.\n\nThroughout the session, sponsors will give short introductions, followed by time for questions and conversations. If something sparks your interest, you can continue chatting with the teams at their booths afterwards. We hope you, like many folks in past years, will discover new opportunities and make valuable connections through the conversations started here.", "bio": "", "tags": []}, {"id": "d3-17", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 16, "time": null, "title": "Building your DSL compiler in Python", "speakers": ["Mateusz Sokół"], "level": "Advanced", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "How the Finch sparse-array compiler was ported from Julia to pure Python, using dataclasses, pattern matching and Lark to build an IR-based compiler.", "description": "A multitude of Python libraries offer Just In Time (JIT) compilation capabilities for general purpose computations, such as JAX or Numba. But in certain cases these solutions might not be enough, thus we seek more specialized solutions that can include domain knowledge as well.\n\nCompilers for Domain Specific Languages (DSL) allow us to incorporate additional information during compilation, possibly tied to a specific domain, such as sparse arrays computing.\n\nIn this talk I'm going to introduce Finch - language and a compiler for sparse and structured multidimensional arrays, which specializes its kernels for control flow and data structures. It supports common control flow (loops, if conditions, etc.) and a wide variety of data structures - dense, sparse list, triangles, coordinate, or symmetry.\n\nThe ongoing effort to move Finch from the original Julia implementation to pure Python exposed us to new ways of using Python - as a language for implementing compilers.\n\nIn this talk I will present some key aspects of Python language and ecosystem which played a central role in making us productive in the last months during this undertaking:\n\n- Defining IRs with dataclasses and utilizing Structural Pattern Matching for term rewriting,\n- Using Lark for parsing custom languages into large IR structures,\n- Expressing complex rewrite schemes with rewrite-tools.\n\nThe audience will learn our approach to designing the structure of a compiler, together with a few technical decisions made along the way.\nI hope these insights will be useful for engineers and scientists coming from closely related fields and projects also involving compiling custom languages, such as probabilistic programming or hardware design.", "bio": "", "tags": []}, {"id": "d3-18", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 17, "time": null, "title": "Python on Windows on Arm: Ecosystem Enablement Update", "speakers": ["Diego Russo", "Gleb Khmyznikov"], "level": "Beginner", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "A 2026 status update on native Python support for Windows on Arm — compilers, wheels, CI, and what's still missing.", "description": "Running Python natively on Windows on Arm requires more than a working interpreter. To have the best developer experience, it depends on compilers, packaging, binary wheels, CI infrastructure, and support from the wider library ecosystem.\n\nThis talk provides a status update of the Python ecosystem on Windows on Arm in 2026, based on ongoing collaboration between the open-source community, Microsoft, and Arm. We will cover CPython support, packaging, wheels, tooling, and CI availability, with a focus on what developers can realistically use today.\n\nUsing widely adopted libraries such as PyTorch as examples, we will show how native Arm support is being enabled and creating better capabilities across the ecosystem, what remaining challenges projects face when supporting Windows on Arm.\n\nThe talk will also cover the developer and CI story enabled by native Arm runners and Windows 11 Arm images on GitHub Actions, and how this infrastructure lowers the barrier for projects to add and maintain Windows on Arm support.\n\nThe goal is to give a snapshot of the current state, highlight the remaining gaps, and explain how contributors and maintainers can participate to the ongoing effort.", "bio": "", "tags": []}, {"id": "d3-19", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 18, "time": null, "title": "Speeding Up Python with Free Threading and Mypyc", "speakers": ["Jukka Lehtosalo"], "level": "Advanced", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "Can free threading and mypyc's ahead-of-time compilation combine for a '100x' speedup? A measured look at real bottlenecks and gains.", "description": "It's common to hear complaints about Python being slow. In this talk, I will show how to make *some* Python programs dramatically faster by using Python 3.14's free threading and ahead-of-time compilation to C extensions using the mypyc compiler, while staying entirely in Python (and CPython).\n\nFree threading can deliver large speedups for CPU-bound code that can be adapted for parallel execution, while mypyc speeds up workloads that benefit from reduced interpreter overhead and that can use static typing. If each can give a 10x speedup in an ideal use case, can we get a \"holy grail\" 100x speedup by using both?\n\nI'll introduce several small examples inspired by real-world workloads, measuring and explaining what happens when you apply free threading, mypyc, or both. In practice, relatively few programs are perfect fits for both techniques at once, but when they are, you can get substantial gains. Having both tools available gives you options for attacking a wide range of performance problems.\n\nAlong the way, I'll cover various bottlenecks you are likely to encounter while optimizing real-world workloads. These often limit performance scaling. I'll explain how to diagnose and improve allocation-heavy code and thread contention caused by reference counting, in particular.", "bio": "", "tags": []}, {"id": "d3-20", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 19, "time": null, "title": "International Open Source – Your Best Choice in Interesting Times", "speakers": ["Deb Nicholson"], "level": "Beginner", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "Why internationally-stewarded open source, including Python, remains the safest bet as global trade and trust barriers shift.", "description": "We're living in weird times. The lines and connections that hold allies and trusted partners together are changing. New barriers to trade, to travel, to collaboration are affecting everything we do. Python is not immune to these shifts, but internationally stewarded open source is still the best choice if you are looking for software that does what it says it does and doesn't do a lot of things that you don't want it to do.\n\nLarge open source projects are vetted by multiple stakeholders in different counties, using that software for different purposes and running on all different hardware around the world. Increasingly, large projects like Python come with a Software Bill of Materials and massive new patches coming from brand new contributors are looked at with a little more skepticism than they would've been a few years ago. This talk will discuss what's changed about international collaboration and how Python and other community driven projects are looking at security and collaboration these days.", "bio": "", "tags": []}, {"id": "d3-21", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 20, "time": null, "title": "When Python Agents Meet 3D: Automating Blender from Natural Language", "speakers": ["David Rousset"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "A Python-built AI agent that edits Blender scenes from natural language, keeping human creative control at every step.", "description": "What if AI could help design 3D worlds without taking creative control away from humans?\n\nIn this talk, I will present a hosted Blender agent that creates and edits 3D scenes from natural language. The agent runs Blender headlessly inside Docker, communicates with it through a TCP socket protocol, and exposes Python-powered tools for scene creation, object manipulation, materials, screenshots, rendering, and asset import. It is built with the Microsoft Agent Framework and Azure AI Foundry, using Python as the bridge between the LLM, Blender's scripting API, cloud storage, and the hosted runtime.\n\nMore than a technical demo, this talk explores a potential future pipeline for AI-assisted 3D creation: a workflow where artists, game designers, architects, and developers can iteratively generate, inspect, modify, and refine 3D environments while keeping human control at every stage. Instead of replacing creative tools, the agent becomes a programmable collaborator that can accelerate repetitive work, propose variations, and turn high-level intent into editable Blender scenes.\n\nThrough live examples, we will discuss what this could mean for the future of video game world-building, virtual production, and 3D architecture: faster prototyping, more accessible scene creation, and new ways to move from idea to interactive environment. Attendees will leave with a practical architecture for building Python agents that operate real creative software, and a grounded view of both the opportunities and current limitations of human-in-the-loop AI for 3D design.", "bio": "", "tags": []}, {"id": "d3-22", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 21, "time": null, "title": "What I've Learned Maintaining the MCP Python SDK", "speakers": ["Marcelo Trylesinski"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "Lessons from maintaining the MCP Python SDK on how to design tool boundaries, structure codebases, and test MCP servers.", "description": "After months of maintaining the MCP Python SDK and reviewing many community contributions, I've seen some architectural hiccups in repeat. Developers struggle with questions that seem simple but have nuanced answers: When should one tool become three? When does a server need to split into two? How do you test an MCP server without spinning up a full client? When should you use resources or prompts instead?\n\nIn this talk, we will explore my learnings and understand how to design tool boundaries that scale with your server's complexity, structure your codebase for long-term maintainability, and build a testing strategy for your MCP server that works. I'll share real examples from the wild, both the antipatterns to run away from and the implementations worth adopting.\n\nIn 2026, the MCP Python SDK v2 will bring improved typing, a refined API, and better testing primitives. The architectural decisions you make today will determine whether that migration takes a day or a month.\n\nWhether you're maintaining an internal tool or publishing to the community, you'll leave with a clear framework for evaluating your own server's design and concrete next steps to improve it.", "bio": "", "tags": []}, {"id": "d3-23", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 22, "time": null, "title": "reusable-tox.yml: Five Patterns to Eliminate CI/CD Boilerplate", "speakers": ["Sviatoslav Sydorenko (Святослав Сидоренко)"], "level": "Intermediate", "duration": "60 minutes", "room": "Exhibit Hall", "format": "poster", "summary": "Five reusable-workflow design patterns, mapped to familiar software engineering principles, for eliminating duplicated tox/CI boilerplate.", "description": "Maintaining CI/CD configurations across dozens of Python projects means copying the same `tox` invocations, Python version matrices, and error-handling logic into every repository. This poster presents five architectural patterns from the `reusable-tox.yml` project that eliminate this duplication by applying familiar software engineering principles to GitHub Actions workflows.\n\nEach pattern is illustrated with a before/after YAML comparison and a Python code analogy, making the design decisions immediately recognizable to Python developers:\n\n- *Singular inputs* — accepting one Python version per workflow call instead of JSON arrays. Like writing `def run(version: str)` instead of `def run(versions: list[str])` — simpler to reason about, test, and compose via caller-side matrix strategies.\n- *Caller-side matrix strategy* — separating \"what to test\" (the calling workflow's job) from \"how to test\" (the reusable workflow's job). The same Separation of Concerns you'd apply to Python modules.\n- *Three-phase execution* — splitting `tox` runs into environment preparation (`tox --notest`), main execution, and debug rerun on failure. Like Unix pipelines — each stage transforms data through a single responsibility, improving cacheability and error diagnosis.\n- *Composite action hooks* — providing extension points where projects inject custom setup logic without modifying shared infrastructure, discovered automatically via `hashFiles()`. The Dependency Injection pattern applied to CI/CD.\n- *Explicit over implicit* — refusing to auto-detect `tox` environments or infer configuration. Predictable and debuggable beats magical and surprising.\n\nThe poster includes a \"Which pattern solves your problem?\" decision flowchart and a QR code linking to the open-source repository with ready-to-fork templates.\n\nBorn from maintaining dozens of Python projects including aiohttp, CherryPy, and pip-tools, these patterns treat CI/CD with the same architectural rigor as application code.", "bio": "", "tags": []}, {"id": "d3-24", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 23, "time": null, "title": "Why Coding Agents Fail at ML (and How to Fix It)", "speakers": ["Olha Poliuliakh"], "level": "Intermediate", "duration": "60 minutes", "room": "Exhibit Hall", "format": "poster", "summary": "An architecture pairing coding agents with a deterministic tree-search orchestrator to fix why LLM agents drift and repeat themselves in ML experimentation.", "description": "Over the last year, LLM-based coding agents have matured to the point where they can autonomously navigate codebases, edit files, run tests, and iterate on solutions with minimal human input. Many Python teams have started applying these agents to machine learning projects, where the volume of repetitive experimental work makes automation appealing.\n\nHowever, coding execution and ML optimization are not the same problem. In software engineering, success is often local and binary: a feature works or it does not, a bug is reproduced or fixed. In ML, code correctness is only a prerequisite. Progress is determined by measured model behavior across repeated experiments, and that measurement only happens after training and evaluation are complete. This distinction creates a coordination gap. Coding agents can generate and modify training code, but without external structure they drift over long experiment horizons. Teams encounter recurring failure modes: multiple coupled changes in a single step make results unattributable, LLMs lose context and rediscover already tested hypothesis in slightly different wording, etc.\n\nThis poster presents an architecture that addresses the gap by pairing coding agents with a deterministic (non-LLM) orchestrator. The orchestrator manages experimentation as a tree search. It starts from a reproducible baseline, samples hypothesis-driven modifications constrained to a single aspect per step, evaluates each modification through a fixed entrypoint that returns multiple metrics, and decides which branches to expand or prune based on statistical evidence. Each experiment runs in an isolated git worktree, so every branch has a clean file state, an independent diff, and a separate log. An anti-repetition memory tracks previously attempted hypotheses across the tree to prevent the agent from regenerating equivalent ideas. When stopping criteria are met, an integration stage combines winning branches and evaluates the result.\n\nThis presentation is aimed at ML engineers and data scientists who have experimented with (or are considering) coding agents for their workflows. Attendees will learn how to utilize coding agents for ML tasks and structure experiments as an LLM-searchable trajectory with deterministic controls rather than a sequence of ad-hoc edits.", "bio": "", "tags": []}, {"id": "d3-25", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 24, "time": null, "title": "PyPartMC: A Pythonic interface enhancing Fortran-based simulation package", "speakers": ["Gracjan Adamus"], "level": "Beginner", "duration": "60 minutes", "room": "Exhibit Hall", "format": "poster", "summary": "How PyPartMC wraps the Fortran/C++ PartMC aerosol simulator into a single pip-installable, cross-platform Python package.", "description": "**PyPartMC** is a Pythonic interface to *PartMC*. PartMC (Particle Monte Carlo) is a stochastic, particle-resolved atmospheric aerosol dynamics model, used for solving aerosol processes such as coagulation, nucleation, emission, and deposition. Both projects are free and open-source.\n\nOne of the main aims of the PyPartMC project is streamlining user experience. To use PartMC, you have to: work with UNIX shell, provide Fortran and C libraries, and perform standard Fortran and C source code configuration, compilation and linking. All of that boils down to a single **pip** package manager call with PyPartMC. Depending on the OS, PyPartMC will install from a binary wheel or compile from a source wheel containing all the dependencies.\n\nPyPartMC can operate on **Linux**, **Windows** and **MacOS**, and has been tested to install correctly on **Google Colab** Jupyter notebook cloud platform. The API is also callable from C++, Julia, and MATLAB. PyPartMC ships with a collection of introductory notebook examples, that can help with learning the library's API.\n\nFrom the developers point of view, PyPartMC is an interesting challenge, due to its **multi-language** environment. A C++ API is built on top of the Fortran one, leveraging the C-Fortran API. The Python interface is then constructed with the help of **nanobind** library.\n\n**PyPartMC** is part of **open-atmos**, which is a multi-institutional community hub for projects in atmospheric sciences (https://github.com/open-atmos). The development of this package is a collaboration between AGH University of Krakow and University of Illinois Urbana-Champaign.\n\nIn the poster, I will outline the package features and architecture, and also highlight the newly engineered components and CI workflows engineered in our team at AGH.", "bio": "", "tags": []}, {"id": "d3-26", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 25, "time": null, "title": "Lazy imports and the art of interpreter procrastination", "speakers": ["Pablo Galindo Salgado"], "level": "Intermediate", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "How PEP 810's explicit lazy imports work inside CPython, from proxy objects to the moment a deferred module snaps into place.", "description": "From CLI developers to maintainers of large applications, many Python developers have been bitten by the high overhead of eagerly loading imports. Long start-up times can make it prohibitively costly to run simple commands like --help, and the memory overhead from loading every imported module eagerly can trigger Out-Of-Memory errors in production.\n\nAfter the most discussed PEP thread in the history of discuss.python.org, with hundreds of messages and fierce debate, Python 3.15 finally brings Explicit Lazy Imports to the language. With a simple new keyword, you can now defer module loading until the moment you actually need it. This is one of the most requested performance features in Python's history, and finally it's here.\n\nThis presentation will take you through how we got here and where we're going. We'll look at why existing workarounds never quite worked, and how an earlier proposal (PEP 690) tried to make all imports lazy by default but was rejected. Then PEP 810 emerged with a different approach: explicit, opt-in syntax that the community accepted.\n\nThe heart of this talk is discovering how lazy imports actually work inside the interpreter. We'll trace through the bytecode, see how proxy objects stand in for unloaded modules, and watch the moment when your code first touches a lazy import and the real module snaps into place. You'll also learn about the future tooling that we are baking that will help you adopt this safely in your own projects.\n\nWhether you're a beginner curious about Python's future, someone looking to speed up your CLI tools, or you just want to understand what's happening under the hood, this talk will give you everything you need to start using lazy imports with confidence.", "bio": "", "tags": []}, {"id": "d3-27", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 26, "time": null, "title": "How to tackle complex authorization logic (and don't go crazy)", "speakers": ["Maria Lowas-Rzechonek"], "level": "Intermediate", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "How to escape if-else authorization hell in a legacy monolith using a custom policy-based (ABAC) approach in Django and FastAPI.", "description": "Managing complex authorization logic can be a nightmare. Without a framework to help you, it can soon end up in a mess of if-else statements and partial solutions that will only give you a headache.\n\nOne day, I found myself in that exact situation. I decided to tackle the problem, and that's how I came across the concept of \"policy-based authorization\" or ABAC. While there are available libraries for this, I found them of little help for a large, legacy codebase that is monolithic at its core.\n\nIn my talk, I will share my experience in thinking about this problem and how to use ABAC to implement a custom solution that fits your needs. I will outline the main components of my solution and show how it can be applied to Django views and FastAPI endpoints.", "bio": "", "tags": []}, {"id": "d3-28", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 27, "time": null, "title": "Powering Up Your Types with Annotated", "speakers": ["Vladyslav Fedoriuk"], "level": "Intermediate", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "How Annotated turns Python types into a metadata engine that binds Pydantic, SQLAlchemy, and property-based testing to one source of truth.", "description": "Python's type system isn't just for static analysis anymore. With Annotated, our types can carry their own documentation, validation logic, and runtime instructions—effectively breaking the boundary between \"checking code\" and \"executing it.\" This talk explores how Annotated acts as a universal metadata engine, allowing us to define semantic and branded types that attach rich instructions to our data without cluttering the core code.\n\nThe real magic of Annotated lies in its ability to handle composition and layering in application design. We'll look at how to build from the inside out, starting with core business logic in pure Python and then layering on metadata to bridge the gap to higher-level application layers. By enriching primitive types with the annotated-types standard, we can enable (almost) zero-config test data generation and property-based testing using Polyfactory and Hypothesis. From there, we can layer on SQLAlchemy metadata to handle persistence without letting the database schema influence our data model, or use Pydantic to provide specialized data validation and serialization metadata—all within the same type definition.\n\nWe will also see how Annotated serves as a single source of truth for documentation. We'll explore annotated-doc as an alternative approach to documentation compared to traditional Sphinx or NumPy/Google-style docstrings, showing how to leverage type hints to keep our descriptions directly attached to the data they define.\n\nThe goal is to show how composition and layering allow your core logic to stay stable while your infrastructure evolves independently. You'll get a whirlwind tour of how the modern Python stack—including Pydantic, SQLAlchemy, and FastAPI—has converged on Annotated as a primary or at least first-class configuration interface. You'll walk away with a practical framework for using these integrations to keep your software design clean, decoupled, and easy to maintain in everyday development.\n\nThis talk is for anyone interested in modern Python typing and effective application design. We'll focus on how to use Annotated to bind your favorite libraries together and apply these patterns to your daily work. If you're familiar with basic type hints, you're ready to go—we'll build the rest from the ground up!", "bio": "", "tags": []}, {"id": "d3-29", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 28, "time": null, "title": "A vision for software freedom in 2048", "speakers": ["Matthias Kirschner"], "level": "Beginner", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "FSFE's 25th-anniversary talk imagining what software freedom could look like by 2048, and how to help shape it.", "description": "Our litigation against Apple in front of the European Court of Justice, pushing for sustainable long term funding for Free Software in the EU and member states, \"Public Money? Public Code!\", Device Neutrality, Router Freedom, Free Your Android, assistance with licensing questions, a European coding competition for teenagers, and a tale of software, skateboards, and raspberry ice cream. These are some of the activities by the Free Software Foundation Europe (FSFE), which at this year's Europython celebrates its 25 anniversary in empowering users to control technology.\n\nHow would the world like in our area in 2048, if the FSFE has been successful? This talk will give an overview of the FSFE's vision, invite participants to give feedback on the next decades of our journey, and invite everyone to join those who shaped our work for software freedom at the FSFE's anniversary party on Saturday.", "bio": "", "tags": []}, {"id": "d3-30", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 29, "time": null, "title": "Everything you always wanted to know about pandas*", "speakers": ["Francesco Lucantoni"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "Demystifying pandas' hidden mechanics — SettingWithCopyWarning, copy semantics, NaN handling — and previewing pandas 3.0's Copy-on-Write and Arrow future.", "description": "*but were too afraid to ask!\n\n`pandas`, the data wrangling workhorse, will celebrate its *18th year of existence* in 2026. You rely on it daily, but are you truly confident in your code?\n\nThis session is dedicated to the unwritten rules and hidden mechanics that separate a confident user from one who constantly battles warnings and unexpected outputs. We will confront the infamous `SettingWithCopyWarning` that haunts chained operations, clarify the critical differences in *deep vs. shallow copies* and the true cost of using `inplace=True`. We'll also demystify the complex handling of missing data (`NaN`s) and much more!\n\nCrucially, we will look to the future. `pandas` is engaged in a `DataFrame` library race with newer, high-performance libraries like `polars` and `duckdb`. The latest advancements—`pandas` 2.0 and the new and shiny 3.0, with features like *Copy-on-Write* and *Apache Arrow* integration—are the direct response, promising a future of dramatically improved speed, memory efficiency, and data types.\n\nJoin me to master the crucial concepts of the past and prepare for the performance gains and new behaviors of the future, ensuring your skills stay ahead of the curve. Stop guessing and start mastering `pandas`!", "bio": "", "tags": []}, {"id": "d3-31", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 30, "time": null, "title": "Group Presentations", "speakers": [], "level": "Beginner", "duration": "30 minutes", "room": "F0 (Glass Room)", "format": "discussion", "summary": "Community Organizers Summit groups report back their discussion takeaways, with brief Q&A between presentations.", "description": "Following the discussion groups, everyone will come back together for a series of short presentations.\nEach group will share a short summary of their discussion and key takeaways, led by the facilitator or any participant who'd like to present. Brief Q&A moments between presentations will allow other groups to ask questions or share related insights.", "bio": "", "tags": []}, {"id": "d3-32", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 31, "time": null, "title": "Conquer multithreaded Python with Blanket", "speakers": ["Larry Hastings"], "level": "Intermediate", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "How Blanket gives you back control over thread execution order so you can write deterministic, reproducible multithreaded tests.", "description": "Debugging and testing multithreaded code in Python is so challenging. How do you create reproducible tests of multithreaded code, when the order of execution changes from run to run? How do you achieve 100% coverage, when you ship code only called to handle rare, obscure race conditions? And if you think it's a problem now... just imagine how much worse it's going to become as adoption of \"nogil\" Python grows!\n\nBlanket is here to help. Come learn how Blanket gives you back control over the order of execution in multithreaded code, enabling you to write deterministic multithreaded tests. Restore blessed order and determinism to your unit test suite--use Blanket!", "bio": "", "tags": []}, {"id": "d3-33", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 32, "time": null, "title": "How Python is Democratising Agritech for Farmers Across Europe", "speakers": ["Felipe Arruda Pontes"], "level": "Intermediate", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "How the EU-funded OpenAgri project uses Django/FastAPI Python microservices on the Edge to bring smart farming tools to 14 pilot farms across Europe.", "description": "How can you create open digital tools that run on both the Cloud and the Edge for small/medium farms across Greek vineyards, French cattle ranches, and Belgian potato fields? The OpenAgri project, funded by the EU Horizon program and now part of the Linux Foundation's AgStack, has developed reusable Python tools for this purpose. These building blocks, using Python Web frameworks such as Django and FastAPI, are already being tested in 14 real-world sustainability pilots across Europe.\n\nIn this presentation, we will show how Python is helping farmers, from camera-based scouting in vineyards to UHF RFID cattle monitoring, UAV pest detection, IoT smart irrigation, and compost production monitoring. We will talk about what works across different countries, the challenges that arise when your \"data centre is a barn\", and what still needs improvement.\n\nJoin us to hear farming stories from across Europe and learn practical lessons on deploying Python microservices on Edge devices to build a more democratised agritech landscape in Europe.", "bio": "", "tags": []}, {"id": "d3-34", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 33, "time": null, "title": "Stop Guessing, Start Understanding: How Arrow and Pandas Exchange Data", "speakers": ["Alenka Frim", "Raúl Cumplido Domínguez"], "level": "Intermediate", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "PyArrow maintainers explain what really happens when data moves between Arrow's columnar format and Pandas' BlockManager.", "description": "Pandas now natively supports PyArrow-backed data types. But what does that actually mean? If you've ever wondered how these two libraries relate to each other, whether they compete or complement each other, and what happens to your data when it moves between them, this talk is for you.\n\nAs PyArrow maintainers, we took on the challenge of digging into the conversion code between PyArrow and Pandas, and we're here to share what we've learned. We'll show you what's really going on under the hood: how Arrow's columnar format differs from Pandas' block-based memory layout (including what a BlockManager actually is), when data can be shared without copying, and when a full copy is unavoidable.\n\nWe'll also clarify what each library is designed for and how they work together rather than against each other. With pandas increasingly adopting PyArrow as a backend, understanding this relationship is becoming essential rather than optional.\n\nThis talk is aimed at Python developers and data engineers who want to deepen their understanding of what's happening beneath the surface.", "bio": "", "tags": []}, {"id": "d3-35", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 34, "time": null, "title": "The Problem with None: Sentinel Values and the Semantics of Absence", "speakers": ["Florian Wilhelm"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "Why None, NotImplemented, and Ellipsis are deliberate design tools, and why Python's type system still can't fully express sentinel semantics.", "description": "None is probably the most overloaded value in Python — and often the wrong one.\n\nPython quietly depends on sentinel values: None, NotImplemented, Ellipsis, dataclasses.MISSING. They aren't just placeholders. They define semantics, coordinate object interactions, and influence API design in subtle but powerful ways.\n\nIn this talk, we treat sentinel values as a deliberate design tool. We'll uncover how NotImplemented enables double dispatch, why None frequently conflates \"missing\" with \"empty,\" and how sentinel patterns permeate the standard library.\n\nBut the real tension appears in typing. Python's type system still cannot properly express sentinel semantics. Optional, overload, and Literal only approximate the problem, and building a fully typed custom sentinel remains an open challenge.\n\nWe'll examine the deferred PEP 661, what it tried to solve, and what its absence means today. Expect practical patterns, real-world examples, and a sharper way to think about absence in Python.", "bio": "", "tags": []}, {"id": "d3-36", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 35, "time": null, "title": "From Ticket Taker to Problem Solver: Discovery for Senior Thinking", "speakers": ["Damian Wysocki"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "Why developer discovery work — business canvases, entity diagrams, user segments — turns ticket executors into problem solvers.", "description": "Have you ever built a feature perfectly, only to discover it solved the wrong problem? Or made architectural decisions that seemed right in isolation but fell apart when business needs changed? You were missing context.\n\nDiscovery workshops give developers what tickets can't: the full picture. This talk explores how proper discovery phase work transforms developers from ticket executors into empowered problem solvers who make better decisions and have more fun doing it.\nDevelopers with discovery artifacts like Business Model Canvas summaries, entity relation diagrams, and mapped user segments write better code. They understand why revenue streams demand certain performance characteristics, how customer segments shape feature priorities, and how key partnerships affect API design.\n\nThis talk walks through the discovery process from a developer perspective. You'll see what artifacts actually help us code, how business requirements map to technical architecture, and why understanding the problem space before touching code prevents costly rework. We'll cover epics, user stories, service architecture, and wireframes, but more importantly, how they connect to real business value.\nDiscovery workshops reduce surprises, empower confident decisions, and accelerate your growth from developer to senior engineer by teaching you to think beyond tickets. Learn how to work smarter by knowing the WHY, not just the WHAT.", "bio": "", "tags": []}, {"id": "d3-37", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 36, "time": null, "title": "The Experience Is the Community", "speakers": ["Georgi Ker"], "level": "Intermediate", "duration": "90 minutes", "room": "F0 (Glass Room)", "format": "workshop", "summary": "An interactive workshop introducing the POPCOM framework for turning open-source contributors into future organizers and mentors.", "description": "Open source communities don't grow because people contribute. They grow because contributors help create the next contributors.\n\nThis interactive workshop introduces the **POPCOM Framework** (Participation, Ownership, Purpose, Connection, Opportunity, and Mentorship), a practical approach for understanding how communities create future contributors, organisers, mentors, and leaders.\n\nWho this workshop is for:\n\n- Meetup organizers\n- Conference organizers\n- Open source maintainers\n- Community managers\n- Volunteer leaders\n\nParticipants will evaluate their own communities, identify areas for improvement, and design concrete change that they can take back and apply.\n\nEach participant walks out with:\n\n- a practical assessment of their own community\n- a framework for identifying strengths and gaps\n- a concrete experiment to improve participation, retention, and leadership development\n\n*The Experience Is the Community* is one module in OCL (Open Community Leadership). You can run this workshop yourself. Adapt the timing to your community.\nFree to use, adapt, and share with attribution.", "bio": "", "tags": []}, {"id": "d3-38", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 37, "time": null, "title": "Defending Open Source from \"AI\" Slop: A Maintainer's Practical Guide", "speakers": ["Sviatoslav Sydorenko (Святослав Сидоренко)"], "level": "Beginner", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "A battle-tested framework from maintaining pip-tools, aiohttp and more for filtering out low-effort AI-generated PRs without alienating real contributors.", "description": "Open source maintainers are drowning in a new kind of noise. \"AI\"-generated pull requests — superficial, poorly reasoned, and submitted without genuine understanding of the codebase — are consuming review bandwidth that was already scarce. These contributions range from cosmetic \"improvements\" that introduce subtle bugs to elaborate refactorings that no one asked for, all bearing telltale signs of LLM output: confident tone, plausible-looking code, and zero awareness of project conventions.\n\nThis talk presents a practical, battle-tested framework for combating \"AI\" slop without discouraging legitimate contributors. Drawing from real experiences maintaining pip-tools, aiohttp, ansible-core, CherryPy, and other Python projects, I'll share concrete strategies that work today.\n\nFirst, we'll dissect the anatomy of \"AI\" slop PRs — what they look like, why they pass superficial review, and the hidden costs beyond wasted review time: CI compute waste, security risks from plausible-but-wrong code, and the demoralizing effect on genuine contributors who see low-effort submissions getting attention.\n\nThen I'll walk through a defense-in-depth approach being developed across my projects: updating `CONTRIBUTING.md` with explicit expectations about understanding the codebase before submitting changes; crafting repository-level LLM instruction files (like `AGENTS.md`/`CLAUDE.md`) that steer \"AI\" tools toward project-specific conventions; configuring PR templates to require evidence of human reasoning; and establishing community norms that set quality expectations without being hostile to newcomers.\n\nWe'll also tackle the harder questions: Where is the line between \"AI\"-assisted (the human drives and understands the change) and \"AI\"-generated (the human clicks \"submit\" on LLM output)? How do we preserve the welcoming culture that makes open source special while defending against low-effort spam? What should platforms like GitHub improve for maintainers?\n\nYou'll leave with a ready-to-adapt policy template and configuration files for your own projects.", "bio": "", "tags": []}, {"id": "d3-39", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 38, "time": null, "title": "You Don't Need to Solve It: What Actually Gets You Hired in Tech", "speakers": ["Wojtek Erbetowski"], "level": "Intermediate", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "A former Codility CTO argues technical interviews score how you think and communicate under uncertainty, not whether you find the correct answer.", "description": "Here's a secret from someone who's been on every side of the hiring table — as a candidate who's passed 80%+ of technical processes (including Google and Meta), as a hiring manager who's interviewed hundreds of engineers, and as the former CTO of Codility, the platform that powers technical assessments at thousands of companies worldwide: the interview is not about solving the problem.\nMost candidates walk into coding interviews laser-focused on getting to the correct solution. They grind LeetCode, memorize algorithm patterns, and panic when they hit a wall. But here's what they miss — interviewers aren't scoring your answer. They're evaluating how you think, how you communicate, and how you handle uncertainty. The candidates who get offers aren't always the ones who solve the problem. They're the ones who make the interviewer want to work with them.\nIn this talk, I'll pull back the curtain on what technical interviews — both coding and system design — actually measure. You'll learn why talking through a wrong approach can score higher than silently arriving at the right one, why system design interviews aren't looking for the \"correct\" architecture, and why the soft skills you think are secondary are actually the main event.\nDrawing from nearly 20 years of real-world experience on both sides of the table, I'll share a practical framework for approaching any technical interview with the right mindset. You'll walk away with concrete strategies you can apply at your next interview — not more algorithm flashcards, but a fundamentally different understanding of what the process is actually testing.", "bio": "", "tags": []}, {"id": "d3-40", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 39, "time": null, "title": "Supporting Android and iOS in your Python package", "speakers": ["Malcolm Smith"], "level": "Intermediate", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "A guide for package maintainers on adding Android and iOS support to native-compiled Python packages using cibuildwheel.", "description": "One of the most exciting recent developments in Python is the addition of Android and iOS as officially-supported platforms. This allows us to reach far more users on the devices where they spend the most time.\n\nWhat does this mean for you as a Python package maintainer? If your package is pure-Python, then it'll probably just work. But if it uses C, Cython, Rust, or any other native-compiled language, then you'll have to take some steps to make it available to these new platforms.\n\nThe mobile support status of the most popular packages on PyPI can be seen at beeware.org/mobile-wheels. Let's help push those numbers up! Come to this talk to learn about:\n\n- Why mobile platforms are important for the future of Python\n- How to build your package for Android and iOS using cibuildwheel\n- How to test your mobile builds – even if you don't have Android or iOS hardware\n- How to distribute mobile packages to your users\n- How to automate all of these things in your CI system\n\nAt the sprints, there will also be an opportunity to put this into practice, by getting personal assistance from the BeeWare team in building your package for mobile.", "bio": "", "tags": []}, {"id": "d3-41", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 40, "time": null, "title": "import ai: building agents can be simple", "speakers": ["Yury Selivanov"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "A new Python AI SDK built on composable primitives, minimal serializable state, and async generators instead of heavy agent frameworks.", "description": "How to design a framework for building agents without it being a framework? What if building agents didn't require complex abstractions and APIs?\n\nWe are presenting the new Python AI SDK - a toolkit built on just a few powerful, fundamental ideas:\n\n- You don't need abstractions, you need composable primitives. You don't need graphs, your Python code is already a graph. With the field evolving this fast, less is more.\n\n- State is king. Keeping the state minimal, safe, and serializable unlocks long-running, durable agents.\n\n- Everything is always streaming. We put Python's async generators center stage and let them shine.\n\nYou'll leave knowing how to build a real agent: with tool calls, human in the loop, and durable execution, in plain async Python, and when less framework beats more.", "bio": "", "tags": []}, {"id": "d3-42", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 41, "time": null, "title": "Fast and Furious: 26's Tooling Stack for a Streamlined Developer Experience", "speakers": ["Nacho Llorca"], "level": "Beginner", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "A modern, Rust-powered Python tooling stack — uv, ruff, pyrefly, prek, semantic-release — for fast, enforced quality checks.", "description": "Cohesive, automated quality checks are first-order necessities — especially as LLMs take on more code-writing responsibilities. But developer experience is just as critical: if type checking takes five minutes, developers either lose their flow or feel tempted to skip it. If linting isn't enforced, reviewer fatigue skyrockets. Blink, and Copilot might commit an API key to your repo — and the list goes on.\n\nThe tooling pioneers we know and love (`black`, `mypy`, and others) paved the way, but a new generation of faster, more reliable tools — yup, rewritten in Rust — is here to guardrail and simplify development. This talk presents a setup for Python development, contrasting the available options.\n\n**What you will learn:**\n\n- **The dependency management wars:** Why `uv` has emerged as the gold standard over Poetry or Hatch.\n- **One tool to rule them all:** How to use `just` as a command runner to unify your local and CI environments.\n- **You shall not pass:** Setting up `ruff` for linting, `pyrefly` (or `ty`) for type hints, and `complexipy` for cyclomatic complexity to keep your codebase cohesive and maintainable. Using `prek` (instead of `pre-commit`) to enforce the standards, including Conventional Commits message syntax and secret detection with `gitleaks`. Replicating pre-commit checks (and test coverage!) with every push in your CI pipeline.\n- **Release the troll:** Implementing `semantic-release` to automate versioning and PyPI publishing.\n\nA configurable Copier template will be provided to explore different setups using these frameworks.\n\n**Prerequisites:** Familiarity with Python development and basic CI/CD concepts. No Rust knowledge required (though a high tolerance for Rust-related puns is encouraged).\n\n**Inspiration:** This talk is inspired by Florian Wilhelm's *\"Streamlining Python Development: A Guide to a Modern Project Setup\"* from PyConDE 2024.", "bio": "", "tags": []}, {"id": "d3-43", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 42, "time": null, "title": "Was, Is, Will Be: Python History, Software Engineering, And AI Our Way", "speakers": ["Paul Everitt"], "level": "Beginner", "duration": "45 minutes", "room": "S1", "format": "talk", "summary": "A reflection on how the Python community came to be, what agentic coding has done to it, and what 'us' can do about it next.", "description": "Python is in a moment. Our entire profession is in a moment. But Python has more power than we think we do: us. In this talk we cover how \"us\" came to be, what the age of agentic coding has done to our profession and community, and close with what we can do about it: from us, for us.", "bio": "", "tags": []}, {"id": "d3-44", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 43, "time": null, "title": "Lightning talks ⚡ Friday", "speakers": [], "level": "Beginner", "duration": "30 minutes", "room": "S1", "format": "lightning", "summary": "Friday's closing round of rapid-fire, attendee-submitted 5-minute talks.", "description": "Enjoy Friday's lightning talks! Short talks about everything by everyone.\n\nLightning talks are 5 minute talks that anyone participating at the conference can submit.\nIf that talk gets selected, you will have the chance to jump into the main stage and show us your project, your ideas, something you have learned, something you are proud of that's helping and contributing to our conference and community, or something else!\n\nLightning talks last a maximum of 5 minutes. You can use less time, but not more.\nThis time limit is strictly enforced!\n\nIf you get accepted, you will be notified by email on the day of your talk by 1pm.\nReply to the acceptance email by 3pm to confirm your spot.\n(If you don't, you lose your spot!)\n\nYou can submit your lightning talk on this form: TBD\nNote that there's a limit of one submission per person.", "bio": "", "tags": []}, {"id": "d3-45", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 44, "time": null, "title": "Conference Closing 🐍", "speakers": [], "level": "Beginner", "duration": "30 minutes", "room": "S1", "format": "ceremony", "summary": "A closing session recapping the whole of EuroPython 2026 before the community heads into the weekend sprints.", "description": "What an amazing week!\nWe had two tutorials days and three talks days filled with amazing topics, but more important, amazing people!\n\nOur community is thankful, and want to close the main conference days.\nJoin us to get a nice summary of what was EuroPython 2026.", "bio": "", "tags": []}, {"id": "d3-46", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 45, "time": null, "title": "Sprint Orientation 🏃", "speakers": [], "level": "Beginner", "duration": "30 minutes", "room": "S1", "format": "ceremony", "summary": "An orientation session explaining what the weekend sprints are, which projects are participating, and how to join.", "description": "Do you know what is a sprint?\n\nThe sprints are activities that will happen during the weekend on a <script>
(function(){
"use strict";

/* ---------- Data ---------- */
var DATA = JSON.parse(document.getElementById('talk-data').textContent);
var TALKS = DATA.talks;
var SPEAKERS = DATA.speakers;
var TALK_BY_ID = {};
TALKS.forEach(function(t){ TALK_BY_ID[t.id] = t; });

var FMT_LABELS = {
  talk:"Talk", keynote:"Keynote", panel:"Panel", workshop:"Workshop",
  poster:"Poster", lightning:"Lightning", ceremony:"Ceremony",
  social:"Social", discussion:"Discussion"
};

/* ---------- Storage ---------- */
var LS_FAV = 'ep2026_favorites';
var LS_THEME = 'ep2026_theme';

function getFavorites(){
  try { return JSON.parse(localStorage.getItem(LS_FAV)) || []; }
  catch(e){ return []; }
}
function setFavorites(arr){
  try { localStorage.setItem(LS_FAV, JSON.stringify(arr)); } catch(e){}
}
function isFavorite(id){ return getFavorites().indexOf(id) !== -1; }
function toggleFavorite(id){
  var arr = getFavorites();
  var i = arr.indexOf(id);
  if (i === -1) arr.push(id); else arr.splice(i,1);
  setFavorites(arr);
  updateStarCount();
}
function updateStarCount(){
  var el = document.getElementById('starCount');
  if (el) el.textContent = getFavorites().length;
}

function getTheme(){
  return localStorage.getItem(LS_THEME) || 'dark';
}
function setTheme(t){
  localStorage.setItem(LS_THEME, t);
  document.documentElement.setAttribute('data-theme', t);
  var btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = t === 'dark' ? '🌙' : '☀️';
}

/* ---------- State ---------- */
var state = {
  view: 'overview',
  query: '',
  day: 'all',
  level: 'all',
  format: 'all',
  room: 'all',
  favoritesOnly: false,
  sort: 'schedule',
  selectedSpeaker: null
};

/* ---------- Helpers ---------- */
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function normalizeSpeaker(name){
  return String(name).replace(/\s*\(.*?\)\s*/g,'').trim();
}

var STOPWORDS = ("the a an and or of to in on for with your you how why what when where "+
  "is are was were be been being this that these those it its as at by from into "+
  "about talk talks python we will can new using use case study session workshop panel "+
  "poster our their his her they i not but if then than so up out over under more most "+
  "less than every all any some no yes do does did has have had which who whom one two "+
  "three real world real-world work works working").split(' ');
var STOP_SET = {};
STOPWORDS.forEach(function(w){ STOP_SET[w]=true; });

var _kwCache = {};
function keywordsOf(t){
  if (_kwCache[t.id]) return _kwCache[t.id];
  var text = (t.title + ' ' + t.summary).toLowerCase();
  var words = text.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(function(w){
    return w.length > 4 && !STOP_SET[w];
  });
  var uniq = Array.from(new Set(words));
  _kwCache[t.id] = uniq;
  return uniq;
}

function dayAbbrev(day){
  return day === 1 ? 'Wed' : (day === 2 ? 'Thu' : 'Fri');
}
function dayFullLabel(t){
  return t.dayName + ', ' + formatDate(t.date);
}
function formatDate(iso){
  var parts = iso.split('-');
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return parseInt(parts[2],10) + ' ' + months[parseInt(parts[1],10)-1] + ' ' + parts[0];
}

/* Minimal markdown-ish renderer for our talk descriptions */
function renderMarkdown(raw){
  if (!raw) return '';
  var text = escapeHtml(raw);
  // links [text](url)
  text = text.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  // bold
  text = text.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  // strikethrough
  text = text.replace(/~~([^~]+?)~~/g, '<del>$1</del>');
  // italics (single asterisk)
  text = text.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
  // inline code
  text = text.replace(/`([^`]+?)`/g, '<code>$1</code>');

  var blocks = text.split(/\n\s*\n/);
  var html = blocks.map(function(block){
    var lines = block.split('\n').map(function(l){return l.trim();}).filter(Boolean);
    if (!lines.length) return '';
    var isList = lines.every(function(l){ return /^[-*]\s+/.test(l); });
    if (isList){
      return '<ul>' + lines.map(function(l){
        return '<li>' + l.replace(/^[-*]\s+/, '') + '</li>';
      }).join('') + '</ul>';
    }
    return '<p>' + lines.join('<br>') + '</p>';
  }).join('');
  return html;
}

/* ---------- Filtering ---------- */
function matchesQuery(t, q){
  if (!q) return true;
  q = q.toLowerCase();
  var hay = [t.title, t.summary, t.description, t.room, t.level, t.format]
    .concat(t.speakers).join(' ').toLowerCase();
  return hay.indexOf(q) !== -1;
}

function getFilteredTalks(){
  var favIds = getFavorites();
  return TALKS.filter(function(t){
    if (state.day !== 'all' && String(t.day) !== String(state.day)) return false;
    if (state.level !== 'all' && t.level !== state.level) return false;
    if (state.format !== 'all' && t.format !== state.format) return false;
    if (state.room !== 'all' && t.room !== state.room) return false;
    if (state.favoritesOnly && favIds.indexOf(t.id) === -1) return false;
    if (!matchesQuery(t, state.query)) return false;
    return true;
  });
}

function sortTalks(list){
  var arr = list.slice();
  if (state.sort === 'title'){
    arr.sort(function(a,b){ return a.title.localeCompare(b.title); });
  } else if (state.sort === 'level'){
    var order = {Beginner:0, Intermediate:1, Advanced:2};
    arr.sort(function(a,b){ return (order[a.level]||0) - (order[b.level]||0) || (a.day-b.day) || (a.order-b.order); });
  } else {
    arr.sort(function(a,b){ return (a.day - b.day) || (a.order - b.order); });
  }
  return arr;
}

/* ---------- Rendering: shared card ---------- */
function badgeHtml(t){
  var timeStr = t.time ? (dayAbbrev(t.day) + ' · ' + t.time) : dayAbbrev(t.day);
  var lvlClass = 'level-' + (t.level || '').toLowerCase();
  var fmtClass = 'fmt-' + t.format;
  var out = '<span class="badge day">' + escapeHtml(timeStr) + '</span>';
  if (t.level) out += '<span class="badge ' + lvlClass + '">' + escapeHtml(t.level) + '</span>';
  out += '<span class="badge ' + fmtClass + '">' + escapeHtml(FMT_LABELS[t.format] || t.format) + '</span>';
  return out;
}

function cardHtml(t, opts){
  opts = opts || {};
  var fav = isFavorite(t.id);

/* ---------- Timeline / calendar grid ---------- */
var CAL_GUTTER_W = 56;   // px, left time-axis gutter
var CAL_COL_W = 170;     // px, per-room column width
var CAL_PX_PER_MIN = 1.8; // px per minute of real/relative time
var CAL_MIN_EVENT_H = 34; // px, minimum block height so short talks stay readable
var CAL_PAD_MIN = 15;    // minutes of padding above/below the day's range

function parseTimeRange(t){
  if (!t.time) return null;
  var parts = t.time.split(/[–‒-]/).map(function(s){ return s.trim(); }).filter(Boolean);
  if (parts.length < 2) return null;
  function toMin(hhmm){
    var m = hhmm.match(/(\d{1,2}):(\d{2})/);
    return m ? (parseInt(m[1],10)*60 + parseInt(m[2],10)) : null;
  }
  var start = toMin(parts[0]), end = toMin(parts[1]);
  if (start == null || end == null) return null;
  if (end <= start) end += 24*60;
  return {start:start, end:end};
}

function parseDurationMinutes(t){
  var m = String(t.duration || '').match(/(\d+)/);
  return m ? parseInt(m[1],10) : 30;
}

// A handful of rooms carry an event-type suffix (e.g. "S1 (Keynote)", "S3A (Panel)")
// that describes the session, not a distinct physical location — fold those back
// into their base room so the calendar doesn't render a spurious extra column.
function calRoomKey(room){
  return String(room).replace(/\s*\((Panel|Keynote)\)\s*$/, '');
}

function isSameLocalDate(iso){
  var now = new Date();
  var d = new Date(iso + 'T00:00:00');
  return now.getFullYear() === d.getFullYear() && now.getMonth() === d.getMonth() && now.getDate() === d.getDate();
}

// Builds a per-room-column layout for one day's talks. When every talk has a
// published time, positions reflect real clock time. Otherwise (days without
// published times) each room's talks are stacked back-to-back using their
// real durations, so height is still accurate even though it isn't clock-anchored.
function buildDayLayout(items){
  var arr = items.slice().sort(function(a,b){ return a.order - b.order; });
  var hasRealTimes = arr.length > 0 && arr.every(function(t){ return !!parseTimeRange(t); });

  var columns = [];
  var seen = {};
  arr.forEach(function(t){
    var key = calRoomKey(t.room);
    if (!seen[key]){ seen[key] = true; columns.push(key); }
  });

  var positioned = [];
  if (hasRealTimes){
    arr.forEach(function(t){
      var r = parseTimeRange(t);
      positioned.push({talk:t, start:r.start, end:r.end});
    });
  } else {
    var cursor = {};
    columns.forEach(function(c){ cursor[c] = 0; });
    arr.forEach(function(t){
      var key = calRoomKey(t.room);
      var dur = parseDurationMinutes(t);
      var start = cursor[key];
      var end = start + dur;
      cursor[key] = end;
      positioned.push({talk:t, start:start, end:end});
    });
  }
  var starts = positioned.map(function(p){ return p.start; });
  var ends = positioned.map(function(p){ return p.end; });
  return {
    hasRealTimes: hasRealTimes,
    columns: columns,
    items: positioned,
    rangeStart: Math.min.apply(null, starts),
    rangeEnd: Math.max.apply(null, ends)
  };
}

function calendarGridHtml(dayMeta, layout){
  var rangeStart = Math.max(0, Math.floor((layout.rangeStart - CAL_PAD_MIN)/5)*5);
  var rangeEnd = Math.ceil((layout.rangeEnd + CAL_PAD_MIN)/5)*5;
  var totalMin = Math.max(30, rangeEnd - rangeStart);
  var totalHeight = Math.max(160, totalMin * CAL_PX_PER_MIN);
  var cols = layout.columns;
  var totalWidth = CAL_GUTTER_W + cols.length * CAL_COL_W;

  var headerHtml = '<div class="cal-gutter-spacer"></div>' + cols.map(function(c){
    return '<div class="cal-col-header" title="' + escapeHtml(c) + '">' + escapeHtml(c) + '</div>';
  }).join('');

  var hourRowsHtml = '', hourLabelsHtml = '';
  if (layout.hasRealTimes){
    var firstHour = Math.floor(rangeStart/60)*60;
    for (var m = firstHour; m <= rangeEnd; m += 60){
      if (m < rangeStart) continue;
      var top = (m - rangeStart) * CAL_PX_PER_MIN;
      var hh = Math.floor(m/60) % 24;
      var label = (hh<10?'0':'') + hh + ':00';
      hourRowsHtml += '<div class="cal-hour-row" style="top:' + top + 'px"></div>';
      hourLabelsHtml += '<div class="cal-hour-label" style="top:' + top + 'px">' + label + '</div>';
    }
  }

  var nowLineHtml = '';
  if (layout.hasRealTimes && isSameLocalDate(dayMeta.date)){
    var now = new Date();
    var nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
    if (nowMin >= rangeStart && nowMin <= rangeEnd){
      var nowTop = (nowMin - rangeStart) * CAL_PX_PER_MIN;
      var nh = now.getHours(), nmm = now.getMinutes();
      var nowLabel = (nh<10?'0':'') + nh + ':' + (nmm<10?'0':'') + nmm;
      nowLineHtml = '<div class="cal-now-line" data-now-line data-range-start="' + rangeStart + '" data-px-per-min="' + CAL_PX_PER_MIN + '" style="top:' + nowTop + 'px">' +
        '<span class="cal-now-dot"></span><span class="cal-now-label">' + nowLabel + '</span>' +
      '</div>';
    }
  }

  var eventsHtml = layout.items.map(function(p){
    var t = p.talk;
    var colIdx = cols.indexOf(calRoomKey(t.room));
    var top = (p.start - rangeStart) * CAL_PX_PER_MIN;
    var height = Math.max(CAL_MIN_EVENT_H, (p.end - p.start) * CAL_PX_PER_MIN);
    var left = CAL_GUTTER_W + colIdx * CAL_COL_W;
    var fav = isFavorite(t.id);
    var timeLabel = layout.hasRealTimes ? (t.time || '') : (parseDurationMinutes(t) + ' min');
    var speakersHtml = t.speakers.length ? '<div class="cal-event-speakers">' + escapeHtml(t.speakers.join(', ')) + '</div>' : '';
    return '<div class="cal-event fmt-' + t.format + '" data-id="' + t.id + '" ' +
      'style="top:' + top + 'px;height:' + height + 'px;left:' + left + 'px;width:' + (CAL_COL_W - 6) + 'px;">' +
      '<button class="cal-star-btn' + (fav?' active':'') + '" data-star="' + t.id + '" title="Star this talk">' + (fav?'★':'☆') + '</button>' +
      '<div class="cal-event-time">' + escapeHtml(timeLabel) + '</div>' +
      '<div class="cal-event-title">' + escapeHtml(t.title) + '</div>' +
      speakersHtml +
    '</div>';
  }).join('');

  return (
    '<div class="cal-scroll">' +
      '<div class="cal-col-headers" style="width:' + totalWidth + 'px;">' + headerHtml + '</div>' +
      '<div class="cal-grid" style="width:' + totalWidth + 'px;height:' + totalHeight + 'px;">' +
        hourRowsHtml +
        '<div class="cal-gutter">' + hourLabelsHtml + '</div>' +
        eventsHtml + nowLineHtml +
      '</div>' +
    '</div>'
  );
}

function renderTimeline(){
  var filtered = getFilteredTalks();
  var html = '';
  var any = false;
  DATA.meta.days.forEach(function(meta){
    var dayItems = filtered.filter(function(t){ return t.day === meta.day; });
    if (!dayItems.length) return;
    any = true;
    var layout = buildDayLayout(dayItems);
    html += '<div class="day-heading"><h2>' + escapeHtml(meta.name) + '</h2><span class="date">' + formatDate(meta.date) + ' · ' + dayItems.length + ' sessions</span></div>';
    if (!layout.hasRealTimes){
      html += '<p class="section-sub timeline-note">Exact times weren\'t published for this day — rooms are shown as parallel tracks in schedule order, and each block\'s height reflects that session\'s real duration.</p>';
    }
    html += calendarGridHtml(meta, layout);
  });
  if (!any) html = gridHtml([]);
  document.getElementById('mainContent').innerHTML = html;

function refreshNowLines(){
  if (state.view !== 'timeline') return;
  var now = new Date();
  var nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  var hh = now.getHours(), mm = now.getMinutes();
  var label = (hh<10?'0':'') + hh + ':' + (mm<10?'0':'') + mm;
  document.querySelectorAll('[data-now-line]').forEach(function(el){
    var rangeStart = parseFloat(el.dataset.rangeStart);
    var pxPerMin = parseFloat(el.dataset.pxPerMin);
    el.style.top = ((nowMin - rangeStart) * pxPerMin) + 'px';
    var lbl = el.querySelector('.cal-now-label');
    if (lbl) lbl.textContent = label;
  });
}
