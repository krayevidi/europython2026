alk", "summary": "A look at self-configuring ETL pipelines that discover APIs and handle auth automatically, no config files required.", "description": "Remember spending entire afternoons configuring data connectors, debugging OAuth flows, and writing custom parsers just to ingest data from a single API? What if I told you that you could just say \"add mlflow as a source\" and have your pipeline automatically discover the API, handle authentication, and start ingesting data — no config files, no setup wizards?\n\nIn this 30-minute talk, I'll show you the reality behind modern self-configuring ETL pipelines that sound too good to be true but actually work. We'll explore how intelligent data connectors leverage public APIs and automatic credential management to eliminate the traditional pain points of data ingestion.", "bio": "", "tags": []}, {"id": "d1-40", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 39, "time": "16:45–17:30", "title": "Core.py recording with Guido van Rossum", "speakers": ["Pablo Galindo Salgado", "Guido van Rossum", "Łukasz Langa"], "level": "Beginner", "duration": "45 minutes", "room": "S1 (Keynote)", "format": "keynote", "summary": "A live, unscripted Core.py episode where Guido van Rossum sits down with Pablo Galindo Salgado and Łukasz Langa for Python war stories and controversial design decisions.", "description": "Join us for a very special live episode of Core.py as Pablo Galindo Salgado and Łukasz Langa somehow convince Guido van Rossum to sit down for what will almost certainly begin as a sensible conversation about Python and quickly spiral into war stories, controversial design decisions, ancient mailing-list archaeology, embarrassing bugs, impossible audience questions, and the occasional existential crisis about discuss.python.org. Expect behind-the-scenes stories you've never heard before, plenty of laughs, and a rare chance to watch three people who have collectively shaped Python try to remember why they made half of its features in the first place. Buckle up: this one's live, unscripted, and anything could happen.", "bio": "", "tags": []}, {"id": "d1-41", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 40, "time": "17:30–17:40", "title": "EuroPython 25th anniversary", "speakers": [], "level": "Beginner", "duration": "10 minutes", "room": "S1", "format": "ceremony", "summary": "A special session celebrating 25 years of EuroPython, with surprises for attendees.", "description": "Join us for a special informative session as we celebrate EuroPython's 25th anniversary — a milestone worth marking together! We have some exciting surprises in store that you won't want to miss, so make sure to stick around after the keynote and be part of this memorable occasion.", "bio": "", "tags": []}, {"id": "d1-42", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 41, "time": "17:40–17:55", "title": "Python Quiz 📝", "speakers": [], "level": "Beginner", "duration": "15 minutes", "room": "S1", "format": "social", "summary": "A fast, fun trivia showdown testing attendees' Python and community knowledge for a shot at prizes.", "description": "Join us for a fast, fun, and brain-twisting quiz all about Python, the tools, and the community.\n\nTest your knowledge, race against the clock, and compete with fellow EuroPython attendees for a shot at some awesome prizes.\n\nWhether you're a seasoned developer or just love a good challenge, this showdown is your time to shine.", "bio": "", "tags": []}, {"id": "d1-43", "day": 1, "date": "2026-07-15", "dayName": "Wednesday", "order": 42, "time": "17:55–18:40", "title": "Lightning talks ⚡ Wednesday", "speakers": [], "level": "Beginner", "duration": "45 minutes", "room": "S1", "format": "lightning", "summary": "A rapid-fire series of 5-minute, attendee-submitted talks on anything and everything.", "description": "Enjoy Wednesday's lightning talks! Short talks about everything by everyone.\n\nLightning talks are 5 minute talks that anyone participating at the conference can submit. If that talk gets selected, you will have the chance to jump into the main stage and show us your project, your ideas, something you have learned, something you are proud of that's helping and contributing to our conference and community, or something else!\n\nLightning talks last a maximum of 5 minutes. You can use less time, but not more. This time limit is strictly enforced!\n\nIf you get accepted, you will be notified by email on the day of your talk by 1pm. Reply to the acceptance email by 3pm to confirm your spot (if you don't, you lose your spot!).", "bio": "", "tags": []}, {"id": "d2-01", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 0, "time": null, "title": "The Pursuit Of Purity (The Right Way To Do AI)", "speakers": ["Marlene Mhangami"], "level": "Beginner", "duration": "45 minutes", "room": "S1", "format": "talk", "summary": "An exploration of the Python community's divide over AI, and an attempt to find the 'right way' to use it responsibly.", "description": "Python now powers nearly half of all new AI repositories (State of the Octoverse Report 2025.) It is the most used language for Applied AI work, from training and inference to orchestration and deployment. Regardless of its popularity in the space, AI has caused a significant divide within the Python community. Many Pythonistas believe it should not be used at all, while others are excited about its potential to increase their output. As developers, we also find ourselves reluctantly at the frontier, being told our jobs are at risk, while simultaneously being pushed to use AI to make us more productive. In this talk we'll explore all of these themes and try to understand the 'right way' to do AI.", "bio": "", "tags": []}, {"id": "d2-02", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 1, "time": null, "title": "Python Steering Council Update", "speakers": ["Python Steering Council (Panel)"], "level": "Beginner", "duration": "25 minutes", "room": "S1", "format": "panel", "summary": "The elected Steering Council reports on maintaining CPython's quality, contributor experience, and its PEP decision-making process.", "description": "The Python Steering Council is a 5-person elected committee that assumes a mandate to maintain the quality and stability of the Python language and CPython interpreter, improve the contributor experience, formalize and maintain a relationship between the Python core team and the PSF, establish decision making processes for Python Enhancement Proposals, seek consensus among contributors and the Python core team, and resolve decisions and disputes in decision making among the language.", "bio": "", "tags": []}, {"id": "d2-03", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 2, "time": null, "title": "Navigating waters of background jobs and queues in Python as of 2026", "speakers": ["Sebastian Buczyński"], "level": "Intermediate", "duration": "45 minutes", "room": "S1", "format": "talk", "summary": "A comprehensive 2026 comparison of Python's background-job ecosystem — Celery, Temporal, FastStream and more — with real case studies.", "description": "Should you use Kafka or RabbitMQ? Which Python library is the right fit? Is Celery still alive and kicking in 2026, or has Temporal taken over the world while we weren't watching? Perhaps we should all migrate to FastStream—or are the native background tasks in your web framework all you really need?\n\nThere have never been so many possibilities when choosing how to queue and distribute work. This talk provides a comprehensive comparison of the modern Python ecosystem. We will explore where each tool shines, how they perform under pressure, and—crucially—when a specific tool is a poor match and should be avoided.\n\nUsing two real-world case studies, we will showcase the capabilities of each library. You will be able to evaluate the developer experience and how debugging works for each solution. You'll walk out with an ultimate decision chart, equipped to choose the perfect stack for your next project.", "bio": "", "tags": []}, {"id": "d2-04", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 3, "time": null, "title": "The Hidden Cost of Complexity: Reducing Cognitive Load in Python", "speakers": ["Jarosław Śmietanka"], "level": "Intermediate", "duration": "45 minutes", "room": "S2", "format": "talk", "summary": "Practical heuristics for spotting and reducing the cognitive load that inheritance, deep nesting and over-applied DRY quietly add to real codebases.", "description": "Some codebases let you ship a change in minutes. Others turn a one-line fix into weeks of investigation.\n\nThe difference is often not skill, tooling, or even architecture—it's cognitive load.\n\nIn this talk, we'll look at real examples from long-lived Python systems to understand how inheritance, deep nesting, excessive abstraction, microservices, and over-applied DRY silently increase the cost of change.\n\nYou'll learn practical heuristics to recognize high cognitive load early and concrete strategies to reduce it—so your team can move faster without rewriting everything.\n\nThis is a pragmatic engineering talk for developers who work in real production code, not greenfield demos.", "bio": "", "tags": []}, {"id": "d2-05", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 4, "time": null, "title": "Robot Holmes and the Silenced Witness: A Noir Guide to Real-Time Voice AI", "speakers": ["Johannes Kolbe"], "level": "Intermediate", "duration": "45 minutes", "room": "S3A", "format": "talk", "summary": "A detective-noir-styled, story-driven session on the real hardships of building production end-to-end voice assistants.", "description": "*The hardships of building End-to-End Voice Assistants in the Wild*\n\nRobot Holmes is back in the mist-choked streets of MLington, but he isn't working solo.\n\nMeet Zintia, an intern from the Voice Assistant district. She's helpful, hyper-efficient, and incredibly annoying, providing Holmes with data before he can lift a finger. But Zintia has a secret. The longer she's on the case, the more of her \"dark side\" emerges. She's not just hearing the truth; she's deciding which parts Holmes is allowed to hear.\n\nThis is a story-driven, practical session for anyone tired of \"Hello World\" chatbots. We will move past the hype to look at what it actually take to make End-to-End Voice Assistants work in the real world.\n\nOur Investigation Includes:\n\n- The Gear: How to use E2E speech models like gpt-realtime and integrate them into a production voice interface using FreeSWITCH and Pipecat.\n- The Interrogation: Navigating the hardships of instruction-following, ensuring underlying LLMs stay on path through defined states and agentic flow.\n- The Double-Cross: Identifying and mitigating \"hidden agendas\" - the hallucinations and safety guardrails that can make a voice assistant turn on its user.\n\nExpect live demos, hard-won production lessons, a detective noir story and a blueprint for building voice agents that are fast, fluid, and (mostly) law-abiding.", "bio": "", "tags": []}, {"id": "d2-06", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 5, "time": null, "title": "Self-Hosted Small Models: From OpenAI Lock-In to Open Models", "speakers": ["Filip Makraduli"], "level": "Intermediate", "duration": "45 minutes", "room": "S3B", "format": "talk", "summary": "A practical migration path from OpenAI embeddings to self-hosted open models like BGE-M3, validated with MTEB benchmarks.", "description": "OpenAI's embedding API is the default for most Python RAG applications, but it creates real problems at scale: data privacy (every document leaves your network), cost (per-token pricing compounds fast), no customization (cannot fine-tune or swap models), and no quality validation. Most teams have never measured whether text-embedding-3-large actually works well for their domain.\n\nOpen embedding models like BGE-M3, GTE-Qwen2, and E5 now match or beat OpenAI on MTEB benchmarks. The problem is not model quality anymore, it is infrastructure: running these models with proper batching, memory management, and quality assurance.\n\nThis talk walks through a practical migration. We start from a typical LangChain app calling OpenAI, switch to self-hosted open models using SIE (an open-source inference server with an OpenAI-compatible endpoint), validate that retrieval quality is maintained using MTEB, and then go beyond what OpenAI offers by adding sparse embeddings for keyword, recall, and cross-encoder reranking for precision.\n\nThe talk is aimed at Python developers who currently use OpenAI embeddings and models and want to understand their options. No prior experience with model serving is required.", "bio": "", "tags": []}, {"id": "d2-07", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 6, "time": null, "title": "From one to 1 million packet/second: scaling global Internet monitoring", "speakers": ["Marco Grossi"], "level": "Intermediate", "duration": "45 minutes", "room": "S4", "format": "talk", "summary": "The real story of scaling a Python-built, worldwide ICMP probing platform from 1 packet/second to 1 million.", "description": "This is the real story about the design, benchmark, tuning and operation of a 24x7 multi-tenant network monitoring platform, that started out at only 1 packet/second, but then with the power of Python it scaled to 1 million packet/second.\n\nIt is like an high performance version of ICMP ping and mtr/traceroute, supports dualstack IP v4/v6, and runs 24x7 on a set of probing nodes distributed Worldwide.\n\nEach ICMP packet needs to be scheduled, crafted, sent, analyzed and stored for query in near-time.\n\nTo make things harder, the probing platform has been designed and tuned to use the least amount of resources as CPU, memory and storage, in order to run on cheap burstable cloud instances.\n\nPython is used everywhere: packet scheduling, generate randomized ICMP packets, send them via RAW sockets, and match results from probing.\n\nProbing results are then pushed to ClickHouse in near-time, and visualized via Grafana.\n\nAnd rest assured that every packet counts.\n\nSome of the concept explored during the talk:\n\n- ICMP protocol, BGP protocol, routing table\n- ping, mtr/traceroute\n- RAW socket in Python, crafting ICMP packets\n- tcpdump, PCAP dump file\n- msgpack, zstd compression\n- object storage\n- Apache Parquet as optimized data storage format\n- near-time batch and streaming data workflow\n- performance profiling and tuning\n- Python vs PyPy performance comparison\n- monitoring of the monitor: probing node performance monitoring", "bio": "", "tags": []}, {"id": "d2-08", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 7, "time": null, "title": "Create your own musical instrument with custom gesture control", "speakers": ["Anna Wszeborowska"], "level": "Beginner", "duration": "150 minutes", "room": "F0 (Glass Room)", "format": "workshop", "summary": "A hands-on workshop building a gesture-controlled digital musical instrument around a real-time timbre-transfer ML model.", "description": "This will be a hands-on workshop during which we will build a digital musical instrument controlled by personalised gestures.\n\nWe will make a standalone desktop application with a web UI which embeds an existing machine learning model for timbre transfer. We will look at an example of a meaningful control of the model for creative use in interactive, real-time sound generation.\n\nFinally, we will use interactive machine learning to define a personalised way of controlling the instrument based on a few examples provided on the fly.\n\nWorkshop goals:\n\n- Demonstrate a practical example of creating a musical instrument with custom gesture control.\n- Walk you through a typical architecture of a real-time system with interactive control.\n- Show you how to run an existing machine learning model for timbre transfer on your computer and embed it in a desktop application.\n- Discuss ways for incorporating interactive methods for augmenting user interactions.", "bio": "", "tags": []}, {"id": "d2-09", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 8, "time": null, "title": "Args: Amazing or Approaching?", "speakers": ["Evan Kohilas"], "level": "Intermediate", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "A critical look at Python's argument system — from default args to **kwargs — and where it could still be improved.", "description": "From default args, to `**kwargs`, and everything in-between, Python's comprehensive argument system lends itself to some of the most effective code, through encouraging readability, reuse, and easy refactoring.\n\nBut is that really true? Why, and why not? What could we learn from other languages? And what else could lie in their future?\n\nIn this session, we'll give a rundown of Python's comprehensive function argument system and how its features allow for safety, conciseness, and expressiveness (whether you're calling or writing functions).\n\nWe'll then give examples for where that system lacks, where it could bite you, and give suggestions for what more could be done on Python code to fix those limitations.", "bio": "", "tags": []}, {"id": "d2-10", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 9, "time": null, "title": "From Pixels to Insights: Python for Earth Observation", "speakers": ["Eleni Tokmaktsi"], "level": "Beginner", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "An end-to-end Python workflow using Rasterio, NumPy and Sentinel-2 satellite data to turn wildfire imagery into actionable insight.", "description": "Due to climate change, large wildfires continue affecting all continents of the Earth, leading to forest loss and exacerbating environmental impacts. Even more, current changing weather conditions associated with global warming will further increase fire danger to a global extent. Investigating these phenomena in a data-driven manner helps in decision making in pre-intervention and post-restoration following wildfire events. Satellites orbiting Earth can offer critical insights by capturing detailed images of the planet's surface. Utilizing this data, environmental scientists perform detailed assessments to monitor an ecosystem's loss and post-restoration progress. However, data from satellites arrive in the form of millions of raw pixels and turning them into analysis ready products is a time-consuming task full of multi-step and error-prone processes.\n\nThis talk introduces an end-to-end Python workflow to automate the processing of Earth Observation (EO) data. The presentation walks through pixels to insights showcasing a real example and highlighting both the power of automation in the field of remote sensing and the importance of EO data in climate change monitoring. After the session, the audience will understand how utilizing open Python packages such as Rasterio and NumPy with openly distributed data from the European Space Agency's Sentinel-2 mission can lead us quickly into crucial and spatially meaningful information. Although the demonstration focuses on wildfire events, the automated workflow is broadly applicable to other environmental fields such as land cover change detection, hydrological assessments and coastal studies.\n\nNo prior knowledge is required! The goal is not to delve into complex mathematical equations, but to showcase the power of automation in remote sensing with Python.", "bio": "", "tags": []}, {"id": "d2-11", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 10, "time": null, "title": "An Introduction to Writing Fast GPU Code in Python", "speakers": ["Abhik Sarkar"], "level": "Intermediate", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "Building the correct mental model for GPU performance in Python — memory-bound vs compute-bound, tiling, and Triton kernels.", "description": "GPUs power almost every modern Python workload in machine learning, vision, and scientific computing. Yet most Python developers treat GPUs like \"faster CPUs\" and hope frameworks will handle performance automatically. That mental model is wrong and it is the main reason Python GPU code underperforms by orders of magnitude.\n\nThis introductory talk builds the correct mental model for writing fast GPU code in Python. We will explore how modern GPUs are structured, why global memory dominates execution time, and how to determine whether a kernel is compute-bound or memory-bound using the roofline model. Through concrete examples, attendees will see why naive parallel kernels fail to scale and which hardware-aware patterns; tiling, data reuse, and kernel fusion actually lead to speedups.\n\nThe session concludes with a practical look at how Python can express these ideas using Triton, showing how high-level code is compiled into PTX and how Python can approach near-CUDA performance when it respects hardware constraints.", "bio": "", "tags": []}, {"id": "d2-12", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 11, "time": null, "title": "Deploying Python Web Apps in 2026", "speakers": ["Will Vincent"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "A demystifying overview of Python web app deployment architecture and a checklist for Django, Flask and FastAPI.", "description": "Deploying a Python web app is deeply confusing for newcomers, but it doesn't have to be! In this talk, I'll provide an overview of the entire process, with visuals and code, to demystify it and share hard-won lessons along the way.\n\nWe will start with a high-level overview of the architecture underpinning deployment: web servers vs. app servers, queues, security considerations, databases, caching, environment variables, and more. Then we will discuss Python-specific aspects, such as how WSGI (PEP 333) standardized the process across all frameworks. Finally, we will review a deployment checklist for Django, Flask, and FastAPI, highlighting where they overlap and where they differ.\n\nThe goal of this talk is to explain how web deployments work under the hood, highlighting the Python-specific technical underpinnings that enable a knowledgeable developer to quickly deploy any Python web app, whether using FastAPI, Django, or Flask.", "bio": "", "tags": []}, {"id": "d2-13", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 12, "time": null, "title": "No More \"It Works on My Notebook\"!: From Notebook to Production-Ready Model", "speakers": ["Ariane Djeupang"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "A clear, repeatable ML deployment lifecycle covering containerization, serverless options, monitoring, and MCP for secure model access.", "description": "Deploying machine learning models should be predictable, repeatable, and auditable—not a leap of faith. This talk breaks the deployment lifecycle into clear, actionable steps and demonstrates pragmatic choices for containerization, serverless and platform-based deployments, monitoring, and scaling. It also introduces the Model Context Protocol MCP as a practical pattern for giving deployed models secure, auditable access to external data and tools. Attendees will leave with concrete patterns, a checklist to avoid common pitfalls, and reproducible workflows they can apply the next day to move models from experimentation into reliable production services.", "bio": "", "tags": []}, {"id": "d2-14", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 13, "time": null, "title": "Immutability: Fast and Safe sharing of Data across Subinterpreters", "speakers": ["Fridtjof Stoldt", "Tobias Wrigstad"], "level": "Intermediate", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "A design walkthrough of PEP 795, which lets Python sub-interpreters share immutable objects by reference instead of pickling and copying.", "description": "Python supports parallelism through multiple sub-interpreters. Parallelism though sub-interpreters avoid the restrictions of a single GIL, and isolating parallel processes from each other is safe from data-races. The downside is that subinterpreter isolation comes with a high cost: sending objects across sub-interpreters typically involves pickling and copying which has negative impact on performance with both CPU and memory overheads. This talk is about PEP795 which adds immutability to Python, which permits sub-interpreters to transfer and share immutable objects directly by reference.\n\nWe will present the design and rationale for immutability in Python, the API for creating and managing immutable state, decorators for communicating immutability in code, as well as opting out of immutability where necessary. We will also discuss our prototype implementation on-top of Python 3.15, and demonstrate how immutable sharing across sub-interpreters improves performance, and compare the speed of freezing (the act of making objects immutable) to pickling and unpickling.\n\nAttendees will learn:\n\n- About the semantics of immutability in Python, and what are the challenges of designing immutability to support sharing across sub-interpreters.\n- When immutability can improve performance and predictability in concurrent Python.\n- How freezing works for built-in types, user‑defined types and functions, and how it interacts with sub-interpreters.\n- Performance of pickling vs. immutable sharing, with numbers and failure modes.\n- Current limitations of immutability, risks, and what would need to land in CPython for this to be widely usable. Target audience: programmers interested in concurrent programming in Python.\n\nNote: This PEP is not yet accepted; the talk focuses on design, prototype results, and open questions.", "bio": "", "tags": []}, {"id": "d2-15", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 14, "time": null, "title": "Python Games in the Browser: Teaching with WebAssembly", "speakers": ["Farhaan Bukhsh"], "level": "Intermediate", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "Using Pyodide/WASM to make the browser a live, zero-install Python teaching environment built around editable in-browser games.", "description": "This talk explores how Python games can run entirely in the browser using WebAssembly (WASM) and how they can also be written and modified directly in the browser using Python itself.\n\nRather than treating the browser as a mere deployment target, this talk presents it as the primary learning environment. Learners interact with a browser-embedded code editor where they write Python code that directly controls and modifies a game, which is also implemented in Python. This creates a zero-install, highly interactive learning experience where Python concepts are introduced through familiar game mechanics instead of traditional REPLs or slide-based instruction.\n\nThe focus of this talk is not on building a game engine, but on how educators and instructors can leverage WASM to safely run Python in the browser for teaching purposes. The talk introduces a tool the speaker built that enables instructors to design browser-based Python tutorials using common game concepts such as scenery, sprites, and swatches, making it easier to create engaging, game-driven learning content.\n\nThe talk covers:\n\n- How Python can be executed in the browser using WebAssembly\n- A comparison of Pyodide vs. pyscript, highlighting their benefits and limitations in educational contexts\n- How browser-based execution changes assumptions around security, isolation, and infrastructure\n\nIn the latter part of the talk, this approach is packaged as an XBlock, the modular unit used to build courses in Open edX. This demonstrates how WASM-based Python execution can be integrated into large-scale learning platforms and how it compares to traditional server-side execution models such as CodeJail, highlighting improvements in safety, reduced infrastructure complexity, and an improved learner experience.\n\nWebAssembly enables a new class of interactive, game-based Python learning experiences that run securely and entirely in the browser, without requiring local setup or server-side code execution.", "bio": "", "tags": []}, {"id": "d2-16", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 15, "time": null, "title": "GPU Programming in Pure Python", "speakers": ["Bryce Adelstein Lelbach"], "level": "Intermediate", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "An example-driven tour of the full CUDA Python stack — cuda.core, CuPy, cuda.compute and cuda.coop — for GPU acceleration without leaving Python.", "description": "GPU programming can be scary, but doesn't need to be! Did you know you can access the full performance of CUDA purely in Python? With the full CUDA Python stack, you have a friendly interface to get you started with GPU acceleration.\n\nIn this example-driven talk, we'll begin with a general discussion of the CUDA model and how to manage accelerator devices in Python with cuda.core. Next, we'll teach you how to create arrays and launch work with CuPy. Then, you'll learn how to customize parallel algorithms with cuda.compute and write your own kernels that leverage cooperative algorithms with cuda.coop, and integrate seamlessly with accelerated libraries such as cuBLAS and cuDNN.\n\nWe'll look at a variety of parallel examples, from counting words, to implementing softmax and row-wise reductions.\n\nBy the time the talk is over, you'll be ready to start accelerating your Python code with GPUs!", "bio": "", "tags": []}, {"id": "d2-17", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 16, "time": null, "title": "Django's Magic, FastAPI's Reality: Test Isolation at Scale", "speakers": ["Maciej Sobczak"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "Why Django's test database isolation is easy and FastAPI + SQLAlchemy's isn't, with benchmarked cleanup strategies to fix it.", "description": "Your FastAPI + SQLAlchemy tests pass alone but fail together. Data leaks between tests, and cleanup becomes slower. Meanwhile, it seems effortless in Django. Why?\n\nThis isn't a framework war - we'll dig into what Django actually does behind the scenes to keep the database clean between tests and why that approach isn't straightforward to replicate in a typical SQLAlchemy setup.\n\nWe'll explore common cleanup strategies like recreating schema, truncating, transaction wrapping or template databases and benchmark how they scale as your test suite grows.\n\nYou'll leave with a clear understanding of why this problem exists and practical, benchmarked options to keep your test suite fast and data isolated.\n\nAimed at intermediate Python developers comfortable with writing tests and familiar with basic database concepts like transactions.", "bio": "", "tags": []}, {"id": "d2-18", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 17, "time": null, "title": "Stop firefighting: practical observability for Python APIs, workers & jobs", "speakers": ["Daria Korsakova"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "A vendor-agnostic observability checklist covering the different signals APIs, workers, and scheduled jobs each need to fail loudly instead of silently.", "description": "Production has a special talent for turning \"seems fine\" into \"why is everything on fire?\" — usually because we're missing signals. A service restarts and never becomes ready, a background worker silently stops consuming tasks, or a database gets overloaded and latency creeps up until downstream services (or customers) notice it first. These situations aren't unsolvable — they're preventable with the right signals in place.\n\nThe speaker shares a practical, vendor-agnostic observability checklist for a Python setup with three cooperating workloads: an HTTP API, an event-driven worker, and a scheduled daily job. Each workload fails differently, so each requires a different set of signals to stay observable.\n\nThe talk covers what \"good enough\" looks like for logging, metrics, tracing, and alerting: what to instrument first, what pitfalls to avoid, and how to design alerts that catch problems early without creating noise. Attendees leave with a concrete checklist and a phased rollout order applicable to their own Python services — without rewriting the system or committing to a specific monitoring vendor.\n\nTakeaways:\n\n- A baseline observability checklist every service should have: health/readiness, logging with consistent context, core metrics, and alert routing\n- Workload-specific signals: what to watch in APIs vs background workers vs scheduled jobs, and why one size doesn't fit all\n- Structured logging that works in production: a minimal event schema + contextual fields that speed up debugging\n- Must-have alerts that prevent silent failures: service never becomes ready, worker stalls, scheduled job misses its run, sustained latency increase\n- Where tracing adds value: when it's worth the effort, what \"minimal viable tracing\" looks like, and what's optional at the beginning\n- A rollout sequence you can apply incrementally: what to do first, what to add later", "bio": "", "tags": []}, {"id": "d2-19", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 18, "time": null, "title": "Python Dicts: Past, Present, and Free-Threaded Future", "speakers": ["Lysandros Nikolaou"], "level": "Advanced", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "A deep dive into CPython's dict internals and what had to change to make them thread-safe under free-threading.", "description": "Python dicts are everywhere! They back module namespaces, instance attributes, `**kwargs`, and of course actual dictionaries. But have you ever wondered how they work under the hood? And more importantly, what happens to them now that free-threaded Python is here?\n\nIn this talk, we'll start by exploring the internals of CPython's dict implementation: how hashing works, the compact table layout that gives you insertion order, and how lookups, insertions, and deletions actually play out in memory. Then we'll see what had to change for free-threading: how reads remain fast without acquiring locks, what the per-object lock is and when it kicks in, and why making a dict thread-safe is harder than it sounds.\n\nFinally, we'll look at the ongoing effort to document CPython's thread-safety guarantees for built-in types and what the resulting documentation means for a Python developer writing concurrent code.\n\nThe audience will leave with a deep understanding of how Python's most important data structure works, how it's been adapted for a free-threaded world, and what they can (or can't) safely do with dicts across threads.", "bio": "", "tags": []}, {"id": "d2-20", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 19, "time": null, "title": "Building a Smart Home Device with MicroPython", "speakers": ["Michał Karzyński"], "level": "Beginner", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "How to build a custom MQTT smart-home device on an ESP32 with MicroPython and bridge it into Apple or Google Home via Home Assistant.", "description": "Your smart home is a wireless network of connected devices which all talk to each other by sending messages into a central hub. If you control the hub's messaging queue, you can control and monitor the network and even create your own custom devices that end up visible in services like Apple or Google Home.\n\nIn this talk the speaker shows what it takes to create such a custom device using an affordable ESP32 microcontroller running MicroPython, looking at the capabilities of the ESP32 family and why it is a good choice for WiFi-enabled projects, along with tooling that makes development a pleasure — from flashing firmware to interacting with the board using WebREPL, installing lightweight dependencies with mip, testing, logging, and more.\n\nThe talk also discusses the MQTT protocol, how custom devices can send and receive messages, how to integrate third-party Zigbee devices, and how to use Home Assistant as a bridge between an MQTT server and Apple or Google Home, including the Mosquitto broker, client tools such as paho.mqtt, and Zigbee2MQTT.\n\nThe goal is to give a practical overview of the hardware and software pieces involved: ESP32, MicroPython tooling, MQTT infrastructure, Zigbee integration, and Home Assistant bridging. If you are comfortable with Python and curious about embedded systems, this talk is for you.", "bio": "", "tags": []}, {"id": "d2-21", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 20, "time": null, "title": "Python Stings Your Ego: Finding Pride in Community, Not Just Code", "speakers": ["Emmanuel Ugwu"], "level": "Intermediate", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "A personal story of how Python and communities like Black Python Devs turn the sting of humility into pride in belonging.", "description": "In tech, it's easy to get caught up in ego. Chasing the smartest solutions, writing the most complex code, or proving who's the best in the room. But Python has a funny way of humbling us. Its simplicity reminds us that good code isn't about showing off; it's about making things clear, accessible, and collaborative.\n\nThis talk is about what happens after that sting of humility. Python doesn't just strip away ego, it builds communities that make you feel proud to belong. The speaker shares stories from his journey with Black Python Devs and other Python groups, showing how people from all walks of life come together, support one another, and create space for growth.\n\nBy the end, attendees will see that the real magic of Python isn't just the language. It's the people, the openness, and the sense of pride that comes from being part of something bigger than yourself.", "bio": "", "tags": []}, {"id": "d2-22", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 21, "time": null, "title": "Surviving LLM Traffic Spikes: Routing, Rate Limits, and Failover in Python", "speakers": ["Sergi Porta"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "A production LiteLLM Router-based blueprint for routing, rate limiting and failing over multi-provider LLM traffic at Manychat's scale.", "description": "Your team ships an AI feature and users love it. Then one viral post turns \"normal load\" into hundreds of LLM requests per second.\n\nLLM calls don't behave like traditional API requests. They're slow (sometimes seconds), expensive, rate-limited by providers, and a single provider outage can take your entire feature down. You can't just \"add more servers.\" You need a routing layer that knows where to send traffic, when to back off, and how to fail without taking everything with it.\n\nIn this talk, the speaker walks through the LLM traffic routing architecture built in Python at Manychat, where AI-powered automation is served to thousands of Instagram and messaging accounts. Everything shown is running in production, covering the core gateway patterns for multi-provider LLM traffic, implemented using LiteLLM Router as a reference design.\n\nBy the end, attendees walk away with:\n\n- A weighted routing blueprint adaptable to any provider mix\n- Fallback and cooldown rules designed to survive real outages\n- Practical rate limiting (requests and tokens) with retry backoff\n- The monitoring baseline (latency, tokens, errors by provider, weight drift) to catch issues before they cascade\n- A checklist for rolling this out safely, incrementally", "bio": "", "tags": []}, {"id": "d2-23", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 22, "time": null, "title": "The hidden cost of vibe coding", "speakers": ["Sebastian Burzyński"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "A production security case study showing how unsupervised AI-assisted 'vibe coding' compounds into cross-cloud breaches and lost trust.", "description": "Artificial intelligence has become deeply embedded in modern Python development workflows. From generating backend services to refactoring production systems, large language models now influence how software is designed, implemented, and shipped. While these tools offer significant productivity gains, many teams are discovering a less visible cost: code is increasingly produced faster than architectural decisions can be reviewed, validated, and governed.\n\nIn real production environments, particularly those built on distributed services, data pipelines, and cloud infrastructure, unstructured AI-driven development often leads to predictable outcomes: rising defect rates, fragile integrations, unclear system ownership, security regressions, and access control mistakes introduced by AI-generated code. Over time these surface as service outages, compliance risks, lost clients, and escalating maintenance costs. The problem is not AI itself, but the absence of engineering structure around how it is used.\n\nThis talk examines why unsupervised \"vibe coding\" fails at scale and how development teams can adopt a disciplined, AI-assisted development model that improves both velocity and reliability, presenting practical techniques for embedding AI across the Software Development Life Cycle — structured design inputs, architecture validation, automated reviews, testing strategies, and continuous quality controls.\n\nThe session includes a concrete production case study from a rapidly developed, AI-assisted Python system, where starting from access to a single project, the speaker was able to traverse service boundaries and gain visibility into multiple cloud environments and internal repositories across both AWS and GCP. The root cause was not a single vulnerability, but a chain of small, AI-generated decisions: overly broad permissions, copied infrastructure patterns, missing ownership boundaries, and unreviewed assumptions propagated across services, resulting in a system that appeared to move quickly but ultimately required emergency remediation, delayed releases, and loss of trust.\n\nThe talk concludes by addressing a common misconception: a 50% increase in coding speed does not translate into 50% faster product delivery. Without governance, the opposite is often true.", "bio": "", "tags": []}, {"id": "d2-24", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 23, "time": null, "title": "Python Syntax Diagram", "speakers": ["Petr Viktorin"], "level": "Beginner", "duration": "60 minutes", "room": "Exhibit Hall (Poster)", "format": "poster", "summary": "A railroad-diagram poster of the entire Python grammar for exploring the subtle rules behind the language's syntax.", "description": "The poster shows a railroad diagram of the entire Python grammar.\n\nIt allows exploring subtle details of the language, like when parentheses are required around generator expressions, tuples or \"walrus\" assignment operations; what's the precedence of various operators; or what kinds of arguments are possible in function definitions and calls.", "bio": "", "tags": []}, {"id": "d2-25", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 24, "time": null, "title": "How we write unit test in my team in Openchip", "speakers": ["Jan Koprowski"], "level": "Beginner", "duration": "60 minutes", "room": "Exhibit Hall (Poster)", "format": "poster", "summary": "A poster on the unit-testing best practices, mocks vs stubs, and dependency injection habits used by one team at Openchip.", "description": "Have you ever wondered how to write good unit tests? Do you know the best practices for unit testing? Or maybe you're already using unit tests in your project and want to see how others approach them?\n\nIf the answer to any of these questions is yes, this talk is for you. During the session, you'll learn how to write proper unit tests, discover good testing practices, learn to distinguish mocks from stubs, see examples of using dependency injection to improve testability, and find out what pure functions are and why they're easier to test.", "bio": "", "tags": []}, {"id": "d2-26", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 25, "time": null, "title": "Write async. Get sync for free.", "speakers": ["Thom Lane"], "level": "Intermediate", "duration": "60 minutes", "room": "Exhibit Hall (Poster)", "format": "poster", "summary": "A poster version of Modal's Synchronicity project, which lets you write an async library once and get a blocking interface for free.", "description": "When you write a Python library, you have a dilemma. Ship async-only? Ship blocking-only? Or write everything twice and watch both copies drift?\n\nSynchronicity removes this dilemma. Write your library once (in async) and get a blocking interface for free, while avoiding the boilerplate and limitations of `asyncio.run()` wrappers. The talk covers how to handle persistent connections, async generators, clean tracebacks, type hints and more.\n\nSynchronicity has been used in production at Modal for years, and it's fully open source.", "bio": "", "tags": []}, {"id": "d2-27", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 26, "time": null, "title": "Anatomy of a Phishing Campaign", "speakers": ["Mike Fiedler"], "level": "Beginner", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "A dissection of the pypj.org phishing campaign that compromised PyPI accounts, and why WebAuthn stopped it where TOTP failed.", "description": "In July 2025, PyPI users received emails directing them to pypj.org—a near-perfect clone transparently proxying requests to pypi.org. Within hours, attackers compromised four accounts and uploaded malicious releases of the popular num2words package.\n\nThis talk dissects the complete attack chain: how attackers harvested email addresses from public package metadata, built a transparent proxy that relayed TOTP codes in real-time, and why traditional 2FA failed while WebAuthn-based authentication stopped the attack cold.\n\nThe session covers the incident response timeline, challenges getting malicious infrastructure taken down (including initial rejection of abuse reports), and defensive measures deployed afterward—including new email verification for TOTP logins from unrecognized devices.\n\nAttendees will learn exactly how modern phishing attacks work against package repositories, the critical difference between \"phishable\" and \"phishing-resistant\" 2FA, and practical steps to protect accounts and packages from the next campaign. The talk also examines the September 2025 follow-up campaign targeting pypi-mirror.org and patterns across these ongoing attacks.", "bio": "", "tags": []}, {"id": "d2-28", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 27, "time": null, "title": "CPython Panel", "speakers": ["Diego Russo (host)", "Alex Waygood", "Eric Snow", "Ken Jin", "Peter Bierma"], "level": "Beginner", "duration": "60 minutes", "room": "S2", "format": "panel", "summary": "Core developers discuss where CPython is heading — performance, JIT, subinterpreters, free-threading, typing — and how to get involved.", "description": "CPython is changing quickly, with major work happening across performance, the JIT, subinterpreters, free-threading, typing, documentation, tooling, and the contributor workflow.\n\nThis panel brings together core developers with both long-term experience and newer perspectives to discuss where CPython is heading, why these changes matter, and how new ideas become part of the project.\n\nThe conversation will also focus on how people can contribute, whether by testing new features, reporting bugs, fixing issues, improving documentation, reviewing changes, or proposing their own ideas.\n\nThe goal is to help attendees understand how CPython works today, where it is going next, and where they can get involved.", "bio": "", "tags": []}, {"id": "d2-29", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 28, "time": null, "title": "From Molecules to Models: A Guide to AI Drug Discovery with Python", "speakers": ["Jenny Vega"], "level": "Intermediate", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "An accessible intro to AI drug discovery, showing how RDKit, DeepChem and ESMFold turn molecules into data Python developers already know how to handle.", "description": "Developing a single drug takes 12 years with only a 12% chance of success. AI is changing this dramatically: the first AI designed drug have reached human trials, Alphafold won a Nobel Prize and pharmaceutical companies have committed billions to AI partnerships. The best part? The Python ecosystem you already know is powering this revolution.\n\nThis talk introduces AI drug discovery to Python developers with no biology or chemistry background required. It starts with the key insight that makes this field accessible: molecules are data structures, proteins are strings, and drug target binding is just API matching. Through a demo, attendees will see how to represent and visualize molecules with RDKit, convert chemical structures into ML ready vectors, predict drug properties like toxicity and solubility using graph neural networks with DeepChem, and predict 3D protein structures in seconds using the ESMFold API.", "bio": "", "tags": []}, {"id": "d2-30", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 29, "time": null, "title": "What is this footgun called unittest.mock, and how to avoid misusing it", "speakers": ["Claudiu Belu"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "A guide to the silent footguns of Mock and MagicMock, and how spec, spec_set and autospec keep your mocks honest.", "description": "Has this ever happened to you? You're happily coding a new feature in your Python project, and at some point, you make a hasty call with a typo'd keyword argument. You've written unit tests for it, including an assertion with the same typo. The tests pass, the CI is green, the PR is reviewed and merged. But some time later, the service crashes because the real method does not have that keyword argument in the first place. What happened? And more importantly, did you notice any of the mistakes?\n\nUnit tests are crucial in any sort of Python development, from small libraries to large distributed systems. `unittest.mock` is used to isolate dependencies and mock external calls in order to keep the tests simple and focused. But mistakes can slip by (attribute typos, wrong keyword arguments, wrong patch locations), leading to false positive tests and a false sense of confidence in code quality, because `Mock` and `MagicMock` silently auto-create attributes on the fly, even when those attributes do not exist on the real object.\n\nIn this session, topics include:\n\n- Understanding how `Mock` and `MagicMock` allow invalid attributes and calls.\n- Common pitfalls and anti-patterns with `Mock`, `MagicMock`, and `patch`.\n- Using `spec`, `spec_set`, and `autospec` to force mocks to match real objects.\n- Ensuring patched functions and methods have their signatures validated.\n- How to avoid patching the wrong import path.\n- Introducing guardrails in existing projects (e.g. OpenStack's approach) without rewriting the entire test suite.", "bio": "", "tags": []}, {"id": "d2-31", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 30, "time": null, "title": "Python on Serverless: Strategies for Peak Performance", "speakers": ["Alejandro Cabello Jiménez"], "level": "Advanced", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "How tuning Python's GC and swapping Pydantic for TypedDict cut a serverless flight-search API's execution time 4x.", "description": "We deployed Python in serverless environments and quickly saw the performance limits. Serverless systems suffer from startup latency, memory overhead, and repeated object creation as their executions start almost from scratch. Those extra seconds made the user experience painfully slow—and the team couldn't afford it.\n\nLooking into the performance of a flight search engine, the team ran profilers and applied optimizations, finding real gains from tuning Python's GC, reducing stop-the-world pauses, and introducing an asynchronous post-execution process that runs after the handler returns. Execution time was reduced from 1.2 seconds to 300 milliseconds—a 4× speedup—with just a few tweaks.\n\nUnderstanding Python's memory model and its runtime behavior was essential, and the talk dives into this. What's shared is based on AWS Lambda, but it can be applied to any short-lived Python system—whether serverless or containerized.\n\nAnother big gain came from replacing Pydantic with TypedDict for faster parsing, using Redis strategically to distribute operations, and restructuring code to eliminate duplicated transformations. The web API processes thousands of flight offers—deserialize, enrich, transform—and every millisecond counts.\n\nWhile covering optimization techniques, when they matter, and how their impact was measured, the main idea is that attendees will walk away with tactics that help systems stay fast while they grow.", "bio": "", "tags": []}, {"id": "d2-32", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 31, "time": null, "title": "Leading Under Pressure", "speakers": ["Tereza Iofciu"], "level": "Beginner", "duration": "120 minutes", "room": "F0 (Glass Room)", "format": "workshop", "summary": "An interactive workshop for engineers leading without a title, practicing how to stay strategic and supportive when pressure mounts.", "description": "Teams are getting leaner, context switching is constant, and expectations stay high even when clarity is low. Under that pressure, many of us start reacting instead of leading: stepping in too often, firefighting instead of thinking, and quietly carrying load that was never ours to hold.\n\nYou do not need a title for any of this to apply. Leadership shows up in how you respond when things get tense, how you support the people around you, and where you choose to spend your finite energy.\n\nThis workshop is a space to notice what pressure does to your leadership, and to practise doing something different.\n\nDesigned for: engineers and ICs who find themselves leading without a formal title; people who care about their teammates and want to stay effective over time; anyone in a lean, fast-moving environment who keeps ending up as the one who absorbs the pressure; and folks who are often the only one like them in the room, carrying extra invisible load because of it. No management experience required.\n\nWhat will be explored: leading yourself under pressure (how urgency and ambiguity shape your default responses, learning to slow down and create space to think); supporting others without taking over (helping without rescuing, framing problems as shared, building trust when clarity is low); and staying strategic under pressure (understanding where your influence flows, connecting day-to-day reality to the bigger picture, choosing where to put your energy).\n\nFormat: a two-hour interactive workshop with short input bursts, hands-on exercises, solo reflection, and peer learning.", "bio": "", "tags": []}, {"id": "d2-33", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 32, "time": null, "title": "Supercharging Litestar: Extensibility Through Plugins", "speakers": ["Jacob Coffee"], "level": "Intermediate", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "How Litestar's plugin system lets you package routes, middleware and dependencies into reusable, shareable units, à la Flask blueprints.", "description": "Discover how to extend Litestar's core functionality using its powerful plugin system.\n\nThis talk demonstrates practical ways to enhance Litestar applications through custom plugins, highlighting the framework's extensibility and ease of use. Litestar solves the challenge of building flexible Python web applications without adding excessive complexity.\n\nIn this talk, you'll see how its plugin system offers a convenient way to package and distribute code for routes, middleware, security, dependencies, and more—all in a single contained unit. Similar to Flask blueprints or pytest plugins, Litestar plugins let you streamline development by removing boilerplate and providing a clear path for extending or sharing functionality across projects.\n\nBy the end, you'll have concrete steps for building, integrating, and distributing plugin-driven solutions that simplify your Litestar applications at any scale.", "bio": "", "tags": []}, {"id": "d2-34", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 33, "time": null, "title": "Faster Django ORM queries for everybody", "speakers": ["Jan Smitka"], "level": "Intermediate", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "How to diagnose N+1 queries and other Django ORM slowdowns and fix them with indices, views and EXPLAIN.", "description": "Nobody likes a slow application or a website. Not only can it frustrate your users, but it can also directly affect your business metrics, such as conversion rates. Without proper care, your application can easily slow down as your project grows.\n\nOne of the most common sources of slowdowns is your database. Django ORM makes it easy to work with databases, but it also makes it easy to forget how to use it properly.\n\nIn this talk, you will learn how to measure and diagnose database operations in your Django app, fix common issues, and leverage your database engine's features to unleash its full potential. Topics covered include N+1 queries, creating and using database views from Django, database indices, and EXPLAINing queries.\n\nWhile the session focuses on Django apps, most of the topics also apply to SQLAlchemy and other libraries.\n\nAfter the talk, you will know how to diagnose database query performance and have a good understanding of how to fix common performance bottlenecks. Basic knowledge of the Django ORM or a similar tool like SQLAlchemy, as well as general database concepts, is recommended.", "bio": "", "tags": []}, {"id": "d2-35", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 34, "time": null, "title": "Flying in Formation - with Python Threading and ROS2 Parallelism", "speakers": ["Deborah E Danjuma"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "Building a decentralized, threading.Event and ROS2 MultiThreadedExecutor-based auction system to coordinate four real drones in formation.", "description": "Coordinating a swarm of drones to autonomously allocate tasks, bid on them in real time, and execute multi-robot formations sounds like science fiction — but it is entirely possible with Python, a handful of threading primitives, and ROS2's MultiThreadedExecutor.\n\nThis talk walks through the concrete implementation challenges of building a decentralised auction-based task allocation system for a swarm of four Crazyflie UAVs. The focus is on a problem that trips up almost every robotics engineer who graduates from tutorials to real deployments: what happens when your system has to wait for external, asynchronous events — bids from four robots, assignment confirmations, formation completion signals — without blocking the entire node and without introducing race conditions or deadlocks?\n\nThe talk explores how Python's `threading.Event` and `Lock` primitives were used alongside ROS2's MultiThreadedExecutor and ReentrantCallbackGroup to implement a synchronized bid-collation protocol, a global assignment barrier, and a concurrent multi-goal formation controller — all running in parallel on a single laptop while communicating with physical drones over radio.\n\nAttendees will leave with a clear, transferable mental model for combining Python threading with ROS2 callback groups, practical patterns for synchronizing distributed asynchronous events in real-time systems, and an honest account of what breaks in the real world (and why).", "bio": "", "tags": []}, {"id": "d2-36", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 35, "time": null, "title": "Hunting the Invisible: Indirect Prompt Injection in Python Pipelines", "speakers": ["John Robert"], "level": "Intermediate", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "How hidden instructions inside PDFs, web pages, and other data sources hijack AI agents from inside a Python pipeline's own trusted data.", "description": "AI agents are no longer just generating text, they are reading PDFs, scraping websites, calling APIs, and taking autonomous actions inside our Python applications. But what happens when the documents they read are malicious?\n\nIn this talk, the speaker explores indirect prompt injection, a subtle but major attack where hidden instructions embedded in PDFs, HTML pages, or external data sources hijack an AI system's behavior. Unlike classic prompt injection, this attack doesn't come from the user, it comes from the data your Python pipeline trusts.", "bio": "", "tags": []}, {"id": "d2-37", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 36, "time": null, "title": "Learning from the not-so-secret Python security \"cabal\"", "speakers": ["Seth Michael Larson"], "level": "Beginner", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "An inside look at how Python's security team runs coordinated vulnerability disclosure, and how anyone can contribute to it.", "description": "The CPython runtime is some of the most-used software in the world. Part of maintaining a secure software project like CPython is participating in coordinated vulnerability disclosure (CVD). This process allows security researchers and maintainers of projects to work together to fix vulnerabilities and alert the public, keeping all Python programmers and users safe.\n\nIn this talk attendees will learn about how the Python language organizes its security team, how to balance security and open source contribution in coordinated vulnerability disclosure, and the latest in how open source projects can maintain a sustainable vulnerability disclosure program. Attendees that aren't currently contributing to open source projects, but have an interest in their dependencies being secure, will learn ways they can contribute meaningfully to the security of open source projects they depend on.", "bio": "", "tags": []}, {"id": "d2-38", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 37, "time": null, "title": "Binary Dependencies: Identifying the Hidden Packages We All Depend On", "speakers": ["Vlad-Stefan Harbuz"], "level": "Advanced", "duration": "30 minutes", "room": "S2", "format": "talk", "summary": "How 'phantom' binary dependencies like OpenBLAS hide in the Python ecosystem, and the tooling and PEPs aiming to make them visible.", "description": "Package manifests like `pyproject.toml` record source-level dependencies: pandas depends on numpy's code. The story is different for binary dependencies, which exist whenever compiled code, like C code, is called from Python. numpy depends on OpenBLAS's binaries, but this dependency relationship is not recorded anywhere. This makes OpenBLAS a \"phantom\" binary dependency.\n\nPhantom dependencies are hidden from programmers and researchers, which is bad for at least two reasons: security (if a binary dependency has a vulnerability, your project is probably also vulnerable but you won't reliably find out) and sustainability (if we can't keep track of binary dependencies, we can't credit and financially support their maintainers, which can lead to maintainer burnout and supply chain issues).\n\nAccording to the speaker's research, around 20% of Python packages have binary dependencies, making phantom dependencies widespread and putting the public at risk if critical infrastructure is compromised by exploiting these weaknesses.\n\nThe talk describes how the problem of phantom binary dependencies can be fixed within the Python ecosystem, and demos preliminary work: identifying binary dependencies with tools like auditwheel and elfdeps, building better APIs and integrating them with pip and uv, and building on standards like PEP 725, PEP 770, and PEP 804 to record binary dependency relationships. The talk also covers the road toward having binary dependencies managed by system package managers rather than Python package managers.", "bio": "", "tags": []}, {"id": "d2-39", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 38, "time": null, "title": "Python Everywhere: The State of Python on WebAssembly", "speakers": ["Hood Chatham", "Gyeongjae Choi"], "level": "Intermediate", "duration": "30 minutes", "room": "S3A", "format": "talk", "summary": "An update on Pyodide, the CPython-on-WASM distribution, its push to upstream into CPython, and its closing performance gap with native.", "description": "Pyodide is a CPython distribution for JavaScript runtimes. It powers browser-based CPython environments like PyScript, Jupyterlite, and Marimo. Pyodide uses the Emscripten compiler to compile CPython to JavaScript + WebAssembly. Since the fall of 2024, Emscripten has been a tier 3 supported platform of CPython.\n\nThe talk gives demos showing how Pyodide is used in a variety of applications such as interactive notebooks, client side computing, safe code execution for AI, and edge computing.\n\nIt describes work to standardize the Pyodide ecosystem: to upstream most of the Pyodide runtime into CPython, and to allow Pyodide-compatible packages to be uploaded to PyPI, along with long-term goals for the ecosystem.\n\nThe talk also discusses recent progress in closing the large gap between the performance of the Python interpreter on WebAssembly and the performance on native platforms.", "bio": "", "tags": []}, {"id": "d2-40", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 39, "time": null, "title": "Data wrangling in a modern terminal", "speakers": ["Jan Pipek"], "level": "Intermediate", "duration": "30 minutes", "room": "S3B", "format": "talk", "summary": "A look at what the terminal has to offer for reading, manipulating, presenting and plotting data — up to a live dashboard.", "description": "Once we constrain ourselves to a rectangle of fixed-width characters (preferably white on a black background), we start to see the world a bit differently. If we want to thoroughly investigate it (a.k.a. perform data analysis), we have to be equipped with appropriate tools - be it techniques, libraries or standalone console-based applications. The talk looks at what the terminal has to offer when reading, manipulating, presenting and even plotting numerical data, possibly finishing with a live dashboard.", "bio": "", "tags": []}, {"id": "d2-41", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 40, "time": null, "title": "AI Slop to AI Gold: Building Codebases That Last", "speakers": ["Dan Jones"], "level": "Beginner", "duration": "30 minutes", "room": "S4", "format": "talk", "summary": "Why good software engineering practices matter more, not less, in an era where AI can generate code faster than anyone can review it.", "description": "AI can generate Python faster than ever before. It can also generate an astonishing amount of code that nobody wants to maintain.\n\nThat's not a new problem. Every generation of software tooling has made writing code cheaper while increasing the cost of poor engineering. AI is simply the latest example.\n\nSome Python features and architectural patterns don't just catch bugs - they make them difficult to write in the first place. Those ideas weren't designed for AI, but they may be exactly what AI needs.\n\nAI hasn't changed what good software engineering looks like. It's made good software engineering impossible to ignore.", "bio": "", "tags": []}, {"id": "d2-42", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 41, "time": null, "title": "How to Run 160 KM: Building Resilience When Things Feel Hard", "speakers": ["Leah Wasser"], "level": "Beginner", "duration": "45 minutes", "room": "S1", "format": "talk", "summary": "An ultrarunner and open-source founder's lessons on building resilience for hard technical problems, one step at a time.", "description": "What does running 160km (100 miles) have to do with open source? Everything. Both demand that you show up consistently, put in the work, and keep moving forward—even when the path feels uncertain and even when people tell you it can't be done. This talk draws on the speaker's journey as an ultrarunner, a data-driven ecologist in a field dominated by traditional fieldwork, and a founder of a nonprofit effort that leverages community as both a support system and a powerful force to tackle hard technical problems.\n\nThe speaker shares her journey and what it really takes to build resilience in the face of uncertainty. Attendees will leave with a simple framework for moving forward when the path is unclear and the world is rapidly changing, a better understanding of how to find the signal through the noise, and how to build toward something bigger than yourself, one step at a time—and why the people around you are your most powerful resource.", "bio": "", "tags": []}, {"id": "d2-43", "day": 2, "date": "2026-07-16", "dayName": "Thursday", "order": 42, "time": null, "title": "Lightning talks ⚡ Thursday", "speakers": [], "level": "Beginner", "duration": "45 minutes", "room": "S1", "format": "lightning", "summary": "A rapid-fire series of 5-minute, attendee-submitted talks and community announcements.", "description": "Enjoy Thursday's lightning talks! A series of short community/conference announcements followed by short talks about everything by everyone.\n\nLightning talks are 5 minute talks that anyone participating at the conference can submit. If a talk gets selected, the speaker gets the chance to jump into the main stage and show attendees a project, ideas, something learned, something they are proud of that's helping and contributing to the conference and community, or something else.\n\nLightning talks last a maximum of 5 minutes. Speakers can use less time, but not more — the time limit is strictly enforced. Accepted speakers are notified by email on the day of the talk by 1pm and must reply by 3pm to confirm their spot, or the spot is lost. Community/conference announcement submissions follow the same process.", "bio": "", "tags": []}, {"id": "d3-01", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 0, "time": null, "title": "Securing Python for the next decade", "speakers": ["William Woodruff"], "level": "Beginner", "duration": "45 minutes", "room": "S1", "format": "keynote", "summary": "A keynote speculating on how Python security must evolve over the next decade as attacker behavior and the open-source landscape shift.", "description": "The world of open source is undergoing numerous seismic changes, and Python is no exception. This keynote will focus on security: we'll extrapolate (and speculate) on the task of securing Python for the next decade of usage by open source maintainers, corporations, tinkerers, vibe coders, and everyone in between. We'll also cover how we expect attacker behaviors to shift, and how those shifts will require us to discard traditional assumptions as defenders.", "bio": "", "tags": []}, {"id": "d3-02", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 1, "time": null, "title": "The coolest feature in Python 3.14: sys.remote_exec()", "speakers": ["Savannah Ostrowski"], "level": "Intermediate", "duration": "30 minutes", "room": "S1", "format": "talk", "summary": "How sys.remote_exec() enables full IDE-style debugging of live Python processes without restarts, sidecars, or debug flags.", "description": "Have you ever needed to debug a live Python process but couldn't restart it? Didn't want to redeploy with debug flags or manage sidecar containers just to debug your application?\n\nIn this talk, I'll show you why `sys.remote_exec()` is one of the coolest features of Python 3.14! I'll cover the basics of Python's new remote debugging capabilities and demonstrate how `sys.remote_exec()` can be combined with debugpy (an implementation of the Debug Adapter Protocol) to provide full IDE debugging experiences for live processes. I'll share what I learned building a tool that uses these primitives to attach debuggers to FastAPI applications running in local Kubernetes clusters.\n\nBeyond debugging, we'll explore other use cases for `sys.remote_exec()` and how you can apply the feature to solve problems in your own work!", "bio": "", "tags": []}, {"id": "d3-03", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 2, "time": null, "title": "AI Architecture Katas: Learning by Building Small Models in Plain Python", "speakers": ["Veit Heller"], "level": "Intermediate", "duration": "45 minutes", "room": "S2", "format": "talk", "summary": "Building tiny, dependency-light Transformers and other modern architectures from scratch in NumPy to learn the ideas, not just use the frameworks.", "description": "Deep learning is often taught through large frameworks and large models, which is great for getting real projects out of the door, but not always great for learning. This talk is about a different practice: building tiny, runnable versions of various modern architectures with minimal dependencies (mostly Python and NumPy) to learn about the ideas through application.\n\nWe'll get our feet wet by building a small Transformer end-to-end and learn about the model architecture that started the craze. Then we switch perspectives, and learn about other architectures, always staying small and nimble, focusing on applying the math and breathing life into formulas. We will look look at multi-scale modelling (in a simplified version of Renormalizing Generative Models), State Spaces, and other scary concepts, until they are not scary at all anymore.\n\nYou'll leave with a model for turning papers into little prototypes that stay true to ideas and the starting point for your own little lab to build models yourself.\n\nPrerequisites: a basic understanding of NumPy and a willingness to look at Greek letters. No deep learning framework knowledge required.", "bio": "", "tags": []}, {"id": "d3-04", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 3, "time": null, "title": "Localization Made Easy: A Pythonic Approach to Global Applications", "speakers": ["Mario García"], "level": "Intermediate", "duration": "45 minutes", "room": "S3A", "format": "talk", "summary": "A Python + DeepL API pipeline for translating whole codebases while preserving JSON structure and placeholder integrity.", "description": "Scaling an application to a global audience often hits a bottleneck: the manual translation of thousands of strings. While machine translation exists, developers need a reliable way to integrate it into their codebases without breaking JSON structures or losing placeholders.\n\nIn this talk, we will explore a streamlined workflow to optimize the localization (l10n) process using Python and the DeepL API. We will walk through a real-world journey of transforming a single-language platform into a multi-language product, focusing on:\n\nThe Localization Workflow: Designing a pipeline that extracts, translates, and reintegrates content automatically.\n\nStructure Preservation: Strategies to handle nested JSON files and complex data structures, ensuring that keys and code logic remain untouched while values are translated.\n\nVariable & Context Integrity: How to protect placeholders and dynamic segments (like {count} or {date}) so they survive the translation process intact.\n\nAutomated Batch Processing: Using Python scripts to iterate through entire project directories, enabling the translation of multiple files in a single execution.\n\nAttendees will learn how to build a robust localization engine that acts as a \"first draft\" generator, allowing developers to focus on validating quality rather than managing strings.", "bio": "", "tags": []}, {"id": "d3-05", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 4, "time": null, "title": "SPy: high-level Python, low-level performance, no overhead", "speakers": ["Antonio Cuni"], "level": "Advanced", "duration": "45 minutes", "room": "S3B", "format": "talk", "summary": "A deep dive into SPy, a statically-typed Python variant designed for compilation to C/Rust/Go-level speed with zero-cost abstractions.", "description": "SPy is a Python variant designed for compilation: well-specified, debuggable, and expressive. It consists of a low-level core which gives control and speed comparable to C, Rust and Go, and powerful metaprogramming features which make possible to build high-level zero-cost abstractions. The result is something which is statically typed and as fast as C, but with the feeling and ease of Python.\n\nThis talk is a deep dive into the SPy core ideas: in particular, we will explore the internals of the language, show how many builtins are implemented in SPy itself, what \"zero cost abstraction\" means in practice and some end-to-end example of how high-level Python code is compiled into a low-level fast executable.", "bio": "", "tags": []}, {"id": "d3-06", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 5, "time": null, "title": "Design Pressure: The Invisible Hand That Shapes Your Code", "speakers": ["Hynek Schlawack"], "level": "Intermediate", "duration": "45 minutes", "room": "S4", "format": "talk", "summary": "A framework for noticing the invisible 'design pressure' from your tools and methodology that quietly warps your architecture over time.", "description": "Ever had this weird gut feeling that something is off in your code, but couldn't put the finger on *why*? Are you starting your projects with the best intentions, following all best practices, *and* still feel like your architecture turns weird eventually? Are you telling your AI bot to write clean code but entropy keeps getting the best of you?\n\n**Maybe, it's not your fault**! Maybe, the tools or methodology you're using are applying **design pressure** that you're not cognizant of, but that influences the shape of your code.\n\nThe best way to prevent that is becoming aware of the forces at play. So, let's look at what design pressure is, look at the most prominent examples of good and bad, and explore how to leverage the former and quell the latter. Because you can only deal with something you know exists.", "bio": "", "tags": []}, {"id": "d3-07", "day": 3, "date": "2026-07-17", "dayName": "Friday", "order": 6, "time": null, "title": "Community Organizers Summit: Opening and introduction", "speakers": ["George Margaritis"], "level": "Beginner", "duration": "30 minutes", "room": "F0 (Glass Room)", "format": "discussion", "summary": "The kickoff session for the Community Organizers Summit, covering goals, agenda, and a chance to meet fellow organizers.", "description": "Welcome to the Community Organizers Summit!\nWe'll kick off the day with a brief introduction, covering the goals of the summit, the agenda, and how the discussion sessions will w
